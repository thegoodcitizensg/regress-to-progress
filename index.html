  <ul>
    <li>Name yourself → play the <b>Newbie</b> tutorial run → beat the Fitness Assessment → <b>Regress</b> and pick a real class.</li>
    <li>Try a few classes (Bodybuilding, Running/Tri, Calisthenics, Pilates, Metcon) — they should <i>feel different</i>.</li>
    <li>Climb tiers, chase the Council's named goals, win a Tier Trial, beat the final boss, ascend again.</li>
    <li>Explore the map: 🎒 loot, 🎽 gear, the warehouse dig, roam encounters, 📅 live events, 🧠 Muscle Memory.</li>
  </ul>
  <b>What to note:</b> anything <b>confusing</b>, unfun, or too grindy; <b>bugs / glitches</b>; anything that <b>broke</b> or dead-ended; a number that seems off; a joke that didn't land. Hit <b>💬 Feedback</b> anytime.
  <br><br>🛋️ <b>You're a Founding Slob</b> for testing this early. Tap <b>🔔 Beta + Founding Slob</b> to leave your email and get first dibs on beta + early-tester perks.
  ${TELEGRAM?`<br><br>✈️ <b>Join the test community on Telegram</b> for updates + chat: <a class="link" href="${esc(TELEGRAM)}" target="_blank" rel="noopener">open the group</a>.`:""}
  <br><br><span class="tiny">Saves live on this device only — alpha progress may be wiped as the game changes. That's normal.</span>
</div>`; }

function openHelp(){ showModal(`<h3>👋 How to help test</h3>${testBriefHTML()}
  <button class="choice" data-act="openBetaAct">🔔 Beta + Founding Slob</button>
  <button class="choice" data-act="openFeedbackAct">💬 Leave feedback</button>
  <button class="choice" data-act="closeModal">Got it</button>`); }

function openFeedback(){
  showModal(`<h3>💬 Feedback</h3>
    <div class="fb-brief">Found a bug, something confusing, or an idea? Send it straight to the dev — a snapshot of your game is attached automatically so bugs are easy to trace.${TELEGRAM?` Prefer to chat? <a class="link" href="${esc(TELEGRAM)}" target="_blank" rel="noopener">✈️ Telegram community</a>.`:""}</div>
    <label class="tiny">Type</label>
    <select class="txt" id="fbcat">
      <option>🐞 Bug / something broke</option>
      <option>🤔 Confusing / unclear</option>
      <option>😴 Not fun / too grindy</option>
      <option>💡 Idea / suggestion</option>
      <option>💬 Other</option>
    </select>
    <label class="tiny">Your feedback</label>
    <textarea class="txt" id="fbmsg" placeholder="What happened? What did you expect? The more detail, the better."></textarea>
    <div id="fbstatus" class="tiny" style="margin:4px 0"></div>
    <button class="choice" data-act="sendFeedback"><b>Send feedback</b></button>
    <button class="choice" data-act="closeModal">Cancel</button>`);
}

function feedbackContext(){
  const r=S.run||{},a=S.account||{};
  return JSON.stringify({
    v:R2P_VERSION, name:a.name, email:a.email, founder:a.founder, firstSeen:a.firstSeenTs,
    disc:r.disc, tier:r.tier, mode:r.mode,
    actions:r.actions, str:r.str, end:r.end, mob:r.mob, cash:r.cash,
    legacy:a.legacy, ascensions:a.ascensions, path:r.path, enhanced:r.enhanced,
    ua:(typeof navigator!=="undefined"?navigator.userAgent:""),
    vp:(typeof window!=="undefined"?window.innerWidth+"x"+window.innerHeight:""),
    ts:new Date().toISOString(),
  });
}
/* --- BETA / Founding Slob email capture: the durable tester registry (survives cleared storage + new
   devices, unlike the localStorage stamp). Reuses the verified Feedback form with its own category so it
   works with ZERO new setup — filter the Sheet by "🔔 Beta signup" to get the email list. --- */
function openBetaSignup(){
  const a=S.account||{};
  const done = a.betaSignup && a.email;
  showModal(`<h3>${done?"🛋️ Founding Slob — you're on the list":"🔔 Beta list + 🛋️ Founding Slob club"}</h3>
    <div class="fb-brief">${done
      ? `You're signed up as <b>${esc(a.email)}</b>. We'll email you the moment <b>beta</b> (TestFlight) opens — with early-tester perks for being here first. Changed your email? Update it below.`
      : `Playing the alpha makes you a <b>Founding Slob</b>. Drop your email to get pinged when <b>beta</b> opens (TestFlight) and to lock in early-tester perks. No spam — only the milestones that matter.`}</div>
    <label class="tiny">Email</label>
    <input class="txt" id="betaemail" type="email" autocomplete="email" placeholder="you@example.com" value="${esc(a.email||"")}">
    <div id="betastatus" class="tiny" style="margin:4px 0"></div>
    <button class="choice" data-act="sendBeta"><b>${done?"Update my email":"Count me in"}</b></button>
    <button class="choice" data-act="closeModal">${done?"Close":"Maybe later"}</button>`);
}
function sendBetaSignup(){
  const ee=$("#betaemail"), st=$("#betastatus");
  const email=((ee&&ee.value)||"").trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ if(st){ st.textContent="That doesn't look like an email — mind checking it?"; st.style.color="var(--lose)"; } return; }
  if(st){ st.textContent="Signing you up…"; st.style.color="var(--faint)"; }
  S.account.email=email; S.account.betaSignup=true; S.account.founder=true; save();
  const ctx=feedbackContext();
  const dedicated = BETASIGNUP.formAction && /^https:\/\/docs\.google\.com\//.test(BETASIGNUP.formAction);
  if(dedicated){                                    // clean dedicated email list
    const fd=new FormData();
    fd.append(BETASIGNUP.fields.email, email);
    fd.append(BETASIGNUP.fields.name, (S.account&&S.account.name)||"");
    fd.append(BETASIGNUP.fields.context, ctx);
    fetch(BETASIGNUP.formAction,{method:"POST",mode:"no-cors",body:fd})
      .then(()=>betaDone(email)).catch(()=>feedbackFallback("🔔 Beta signup","BETA EMAIL: "+email,ctx,BETASIGNUP.viewUrl));
  } else if(FEEDBACK.formAction && /^https:\/\/docs\.google\.com\//.test(FEEDBACK.formAction)){   // fallback: piggyback feedback form
    const cat="🔔 Beta signup / Founding Slob", msg="BETA EMAIL: "+email;
    const fd=new FormData();
    fd.append(FEEDBACK.fields.category, cat);
    fd.append(FEEDBACK.fields.message, msg);
    fd.append(FEEDBACK.fields.context, ctx);
    fetch(FEEDBACK.formAction,{method:"POST",mode:"no-cors",body:fd})
      .then(()=>betaDone(email)).catch(()=>feedbackFallback(cat,msg,ctx));
  } else { feedbackFallback("🔔 Beta signup","BETA EMAIL: "+email,ctx); }
}
function betaDone(email){ showModal(`<h3>🛋️ Welcome to the Founding Slob club</h3>
  <p class="flav">You're on the list as <b>${esc(email)}</b>. When beta opens, you'll be first to know — perks and all. Now get off your phone and back to the grind.</p>
  <button class="choice" data-act="closeModal">Let's go</button>`); }
function sendFeedback(){
  const me=$("#fbmsg"), ce=$("#fbcat"), st=$("#fbstatus");
  const msg=((me&&me.value)||"").trim(), cat=((ce&&ce.value)||"");
  if(!msg){ if(st){ st.textContent="Please type something first."; st.style.color="var(--lose)"; } return; }
  const ctx=feedbackContext();
  if(st){ st.textContent="Sending…"; st.style.color="var(--faint)"; }
  if(FEEDBACK.formAction && /^https:\/\/docs\.google\.com\//.test(FEEDBACK.formAction)){
    const fd=new FormData();
    fd.append(FEEDBACK.fields.category, cat);
    fd.append(FEEDBACK.fields.message, msg);
    fd.append(FEEDBACK.fields.context, ctx);
    fetch(FEEDBACK.formAction,{method:"POST",mode:"no-cors",body:fd})
      .then(()=>feedbackDone()).catch(()=>feedbackFallback(cat,msg,ctx));
  } else { feedbackFallback(cat,msg,ctx); }
}
function feedbackDone(){ showModal(`<h3>🙏 Thank you!</h3>
  <p class="flav">Your feedback reached the dev (snapshot attached). Now get back to the grind.</p>
  <button class="choice" data-act="closeModal">Close</button>`); }
function feedbackFallback(cat,msg,ctx,viewUrl){
  const vu = viewUrl || FEEDBACK.viewUrl;
  const link = vu
    ? `<a class="link" href="${esc(vu)}" target="_blank" rel="noopener">open the form in a new tab</a>`
    : "the form (being set up)";
  showModal(`<h3>💬 Almost there</h3>
    <div class="fb-brief">The in-game send couldn't reach the channel. Please ${link} and paste your note below — or just screenshot it.</div>
    <label class="tiny">Copy this</label>
    <textarea class="txt" readonly onclick="this.select()">${esc("["+cat+"] "+msg+"\n\n"+ctx)}</textarea>
    <button class="choice" data-act="closeModal">Close</button>`);
}

/* ============================ EVENTS / INPUT ============================ */
document.addEventListener("click",(ev)=>{
  const t=ev.target.closest("[data-act]"); if(!t) return;
  const act=t.getAttribute("data-act"), v=t.getAttribute("data-v");
  if(act==="place"){ if(worldOpen() && v!=="arena" && chance(.08)){ openRoam(); return; } S.run.here=v; tickKeys("visit",{loc:v}); openPlace(v); }
  else if(act==="roamEngage"){ roamEngage(); }
  else if(act==="choose"){ const c=S.run.enc.choices[+v]; if(c.cost&&S.run.stam<c.cost){logLine("lose","Not enough stamina.");render();return;} if(c.cost)S.run.stam-=c.cost; S.run.enc=null; c.do(); }
  else if(act==="leaveEnc"){ S.run.enc=null; render(); }
  else if(act==="startSQ"){ S.run.enc=buildSQEncounter(v); render(); }
  else if(act==="bossWon"){ closeModal(); afterAction(false); regressScreen(); }
  else if(act==="cfRegress"){ closeModal(); afterAction(false); regressScreen(); }   // take the vibes → normal regress (+CrossFitter Legacy, baked into awardRunLegacy)
  else if(act==="failReincarnate"){ _nextPath=null; S.run=freshRun(S.run.disc==="Newbie"?"Bodybuilding":S.run.disc,"normal"); closeModal(); logLine("sys","↩︎ A new life, unburdened by the path that broke you."); coachSay("dailyReturn"); save(); render(); }
  else if(act==="slobReincarnate"){ _nextPath=null; S.run=freshRun(S.run.disc==="Newbie"?"Bodybuilding":S.run.disc,"normal"); closeModal(); logLine("gold","↩︎ Reincarnated — upright, reluctant, alive. The couch recedes. For now."); coachSay("dailyReturn"); save(); render(); }
  else if(act==="cfRunItBack"){ S.run.cfLoop=(S.run.cfLoop||0)+1; S.run.bossBeaten=false; S.run.tierBossReady=false; S.run.arenaOpen=true; logLine("gold",`🔁 RUN IT BACK. Loop ${S.run.cfLoop+1}. The WODs reshuffle, Uncle Rhabdo cracks his knuckles, and the grind does not end. It never ends. That's the point.`); closeModal(); coachSay("dailyReturn"); save(); render(); }
  else if(act==="tierWon"){ closeModal(); afterAction(false); }
  else if(act==="clearOutcome"){ S.run.outcome=null; if(worldOpen() && S.run.here && S.run.here!=="map" && S.run.here!=="arena"){ S.run.enc=buildEncounter(S.run.here); } render(); }
  else if(act==="closeModal"){ closeModal(); }
  else if(act==="beginOnboard"){ const el=$("#obname"); let nm=((el&&el.value)||"").trim().slice(0,24); if(!nm) nm=randomSlobName(); S.account.name=nm; S.account.seenOnboard=true; closeModal(); coachSay("onboarding"); logLine("sys","<b>Welcome, "+esc(nm)+".</b> You're a slob on a couch. Somewhere out there is a gym. It fears you less than you fear it."); save(); render(); }
  else if(act==="randName"){ const el=$("#obname"); if(el) el.value=randomSlobName(); }
  else if(act==="openFeedbackAct"){ openFeedback(); }
  else if(act==="sendFeedback"){ sendFeedback(); }
  else if(act==="openBetaAct"){ openBetaSignup(); }
  else if(act==="sendBeta"){ sendBetaSignup(); }
  else if(act==="pickNode") pickNode(v);
  else if(act==="buyNodeMM") buyNodeMM(v);
  else if(act==="sellLoot") sellLoot(v);
  else if(act==="sellAll") sellAllLoot();
  else if(act==="equipGear") equipGear(v);
  else if(act==="unequipGear") unequipGear(v);
  else if(act==="setPath"){ _nextPath=(v==="none"?null:v); openAscension(); }   // re-render so the picked button highlights (choice was always kept — the highlight was the bug)
  else if(act==="setMode"){ _nextMode=v; openAscension(); }
  else if(act==="joinEvent"){ const ev=activeEvent(); closeModal(); if(!ev){ logLine("sys","📅 No event is on today — come back on its calendar date."); render(); } else if(!worldOpen()){ logLine("sys","📅 Event activities open once you've reached Tier 2 and the world unlocks."); render(); } else { S.run.here="event"; S.run.enc=buildEventEncounter(ev.id); render(); } }
  else if(act==="cycleEvent"){ const i=EVENTS.findIndex(e=>e.id===activeEvent().id); S.account.eventOverride=EVENTS[(i+1)%EVENTS.length].id; maybeRotateEvent(); save(); openEvents(); }
  else if(act==="clearEvent"){ S.account.eventOverride=null; maybeRotateEvent(); save(); openEvents(); }
  else if(act==="buyPatchReal") buyPatchReal();
  else if(act==="redeemIotm") redeemIotm(v);
  else if(act==="equipIotm") equipIotm(v);
  else if(act==="buyMarg"){ if(buyMarginal()){ v==="mm"?openMM():openAscension(); } }
  else if(act==="setNextDisc"){ _nextDisc=v; openAscension(); }
  else if(act==="doRegress") doRegress(v);
});
$("#adbtn").addEventListener("click",()=>{
  if(!canWatchAd())return;
  const g=adStaminaGain();
  S.run.adsToday=(S.run.adsToday||0)+1;
  S.run.stam=Math.min(stamCap(),S.run.stam+g);
  addMeter("screen",20);                       // an ad is a straight +20% screen time (the hard cap on abuse)
  coachSay("ad");                              // ads are Natty-safe now — the Coach just ribs you for it
  logLine("sys",`📺 Ad watched. +${g} stamina. The grind pauses for no one, yet here we are.`);
  S.run.outcome={sketch:{pose:"slob"},text:`📺 You sat through the whole thing. <b>+${g} stamina.</b> ${adSnark(g)}`,cls:"sys"};   // own card → clears any stale rhabdo card
  afterAction(false);                          // card:false → keep the outcome we just set
});
$("#devrefill").addEventListener("click",()=>{ S.run.stam=stamCap(); S.run.injured=false; S.run.rhabdo=false; logLine("sys","🛠️ Dev: stamina refilled."); afterAction(false); });
$("#devtier").addEventListener("click",()=>{ if(S.run.tier<maxTier()){ S.run.tier++; S.run.gains=0; if(S.run.keys)S.run.keys[S.run.tier-1]=null; if(S.run.tier>=maxTier())S.run.arenaOpen=true; S.account.floors.str=Math.max(S.account.floors.str,S.run.str); S.account.floors.end=Math.max(S.account.floors.end,S.run.end); S.account.floors.mob=Math.max(S.account.floors.mob,S.run.mob); logLine("sys","🛠️ Dev: +1 tier → T"+S.run.tier+(worldOpen()?" — world open":"")); } afterAction(false); });
$("#devasc").addEventListener("click",()=>{ S.run.tier=12; S.run.arenaOpen=true; S.run.bossBeaten=true; logLine("gold","🛠️ Dev: ascend-ready — GOAT tier, boss beaten. Pick your next life."); save(); regressScreen(); });
$("#mmbtn").addEventListener("click",()=>{ openMM(); });
$("#stashbtn").addEventListener("click",()=>{ openStash(); });
$("#gearbtn").addEventListener("click",()=>{ openGear(); });
$("#artbtn").addEventListener("click",()=>{ openArtGallery(); });
$("#patchbtn").addEventListener("click",()=>{ openPatchShop(); });
$("#boardbtn").addEventListener("click",()=>{ openBoards(); });
$("#eventbtn").addEventListener("click",()=>{ openEvents(); });
$("#feedbackbtn").addEventListener("click",()=>{ openFeedback(); });
$("#betabtn").addEventListener("click",()=>{ openBetaSignup(); });
$("#helpbtn").addEventListener("click",()=>{ openHelp(); });
$("#tgbtn").addEventListener("click",()=>{ if(TELEGRAM && typeof window!=="undefined") window.open(TELEGRAM,"_blank","noopener"); });
$("#reset").addEventListener("click",()=>{ if(confirm("Hard reset ALL progress (account + run)?")){ localStorage.removeItem(SAVE_KEY); location.reload(); } });
$("#themebtn").addEventListener("click",()=>{ const cur=document.documentElement.getAttribute("data-theme"); const nxt=cur==="dark"?"light":(cur==="light"?null:"dark"); if(nxt)document.documentElement.setAttribute("data-theme",nxt);else document.documentElement.removeAttribute("data-theme"); S.settings.theme=nxt; save(); });

/* ============================ INIT ============================ */
if(S.settings&&S.settings.theme) document.documentElement.setAttribute("data-theme",S.settings.theme);
if(!DEV){ ["devrefill","devtier","devasc","artbtn"].forEach(id=>{ const e=$("#"+id); if(e) e.style.display="none"; }); }   // hide dev tools for testers (add ?dev=1 to show)
if(!TELEGRAM){ const _t=$("#tgbtn"); if(_t) _t.style.display="none"; }   // hide community button if no channel set
const _needOnboard = !S.account.name;
if(_needOnboard){ /* new player → character creation overlay opens right after first render */ }
else if(!S.account.seenOnboard){ coachSay("onboarding"); S.account.seenOnboard=true; logLine("sys","<b>Welcome to Regress to Progress.</b> You're a slob on a couch. Somewhere out there is a gym. It fears you less than you fear it."); }
else coachSay("dailyReturn");
S.account.maxTs=Math.max(S.account.maxTs||0, Date.now());   // seed clock-tamper baseline
maybeRotateEvent();   // announce + set the active calendar event on boot
maybeCertify();
render();
if(_needOnboard) openOnboarding();
setInterval(()=>{ tick(); renderStats(); },1000);
save();
// idle coach nudge
setInterval(()=>{ if(!S.run.enc && Math.random()<0.25 && $("#overlayhost").innerHTML==="") coachSay("idle"); }, 45000);
</script>
