function gateFor(disc, tier){
  if(tier>=(disc==="Newbie"?8:12)) return null;     // top rung → final boss, no further gate
  if(disc==="Newbie") return GATES_NEWBIE[tier]||genericGate(disc,tier);
  if(disc==="Bodybuilding" && GATES_BB[tier]) return GATES_BB[tier];
  return genericGate(disc, tier);
}
function genericGate(disc, tier){
  const next=tierName(disc, tier+1);
  const keys=[{id:"vol", label:"Train", need:5+tier*2, sig:"train"}];
  if(tier>=2) keys.push({id:"roam", label:"Visit places", need:Math.min(5,2+Math.floor(tier/3)), sig:"visit"});
  return {title:next, generic:true,
    give:`The Council wants proof you're ready to be called "${next}." Put the work on the board${tier>=2?" — and get out into the world":""}.`,
    keys};
}

function eventWindow(e,y){ const start=new Date(y,e.m-1,e.d); start.setHours(0,0,0,0); const end=new Date(start); end.setDate(end.getDate()+(e.len-1)); end.setHours(23,59,59,999); return [start,end]; }
function activeEvent(){
  if(S.account&&S.account.eventOverride){ const e=EVENTS.find(x=>x.id===S.account.eventOverride); if(e) return e; }
  const now=new Date(), y=now.getFullYear(); let best=null;
  for(const e of EVENTS){ const [st,en]=eventWindow(e,y); if(now>=st && now<=en && (!best||e.len<best.len)) best=e; }
  return best;   // null when no event is on today
}
function eventGain(){ const e=activeEvent(); return (e&&e.gain)||0; }
function eventLoot(){ const e=activeEvent(); return (e&&e.loot)||0; }
function maybeRotateEvent(){ const e=activeEvent();
  if(e){ if(S.account.curEvent!==e.id){ S.account.curEvent=e.id; logLine("gold",`📅 EVENT — <b>${e.name}</b> is on (${e.date})! 🎁 ${e.perk} · ⚠️ ${e.down}. Head to the 🎪 on the map.`); } }
  else if(S.account.curEvent){ const prev=EVENTS.find(x=>x.id===S.account.curEvent); S.account.curEvent=null; if(prev) logLine("sys",`📅 ${prev.name} has ended for the year. The gym returns to normal.`); } }

  items:{

    tub:`<path d="M12 14 l20 0 l-2 24 l-16 0 z"/><rect x="10" y="8" width="24" height="7" rx="2"/><line x1="16" y1="24" x2="28" y2="24"/>`,
    pill:`<rect x="10" y="18" width="24" height="12" rx="6"/><line x1="22" y1="18" x2="22" y2="30"/>`,
    band:`<path d="M10 30 q12 -22 24 0" /><path d="M10 30 q12 10 24 0" fill="none"/>`,
    chalk:`<rect x="14" y="12" width="14" height="22" rx="2"/><line x1="14" y1="20" x2="28" y2="20"/>`,
    gel:`<path d="M15 10 l12 0 l2 26 l-16 0 z"/><rect x="16" y="6" width="10" height="5"/>`,
  },
  _filter(id){ return `<filter id="${id}" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="${Math.floor(Math.random()*40)}" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>`; },
  // color is a rare treat: only boss/ascension get the gold accent
  make(spec){
    spec=spec||{};
    if(spec.foe && this.foes[spec.foe]) return this.foe(spec.foe, spec);   // encounters/side-quests can star a drawn character
    const w=240,h=170, id="pf"+Math.floor(Math.random()*1e6);
    const pose = this.poses[spec.pose] || this._morePoses[spec.pose] || this.poses.slob;
    const props = (spec.props||[]).map(p=>this.props[p]||"").join("");

    return `<svg class="sketch" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <defs>${this._filter(id)}</defs>

    const art=this.foes[name]||this.foes.ego;

      <defs>${this._filter(id)}</defs>

  item(name,size){

    if(!art) return "";
    return `<svg width="${size}" height="${size}" viewBox="0 0 44 44" aria-hidden="true" style="vertical-align:middle">
      <defs>${this._filter(id)}</defs>
      <g filter="url(#${id})" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${art}</g></svg>`;
  }
};

/* ============================ (2) ENGINE ============================ */

/* --- tunables (floor guardrails live here for playtesting) --- */
const STAM_MAX_BASE=50, REGEN_MS=180000; // 1 stamina / 3 min
const FLOOR_TIER_CAP=5;      // muscle-memory melts only tiers 0..5 of 13 (Guardrail 1; rescaled from 3-of-8)
const FLOOR_SPEED_MULT=0.35; // accelerated tiers cost 35% of normal gains
const FLOOR_TRANSFER_RATE=0.5; // cross-discipline memory applies at 50% (Guardrail 2)
const SAVE_KEY="prorer_v4";
const R2P_VERSION="0.5.1";
/* bodyweight work yields less raw stat than loaded/equipment work (you can't add plates to a push-up).
   These exercise ids are bodyweight → ×0.8 gains in train(). Cardio/metcon/loaded aren't tagged. (Tunable.) */
const BODYWEIGHT_IDS = new Set(["pushup","homewo","bars","push","core","pyramids","ringwork","gymnastics","skill","burpee","tilt","mat","lakemat"]);
const BW_MULT = 0.8;

/* --- helpers --- */
const $=(q)=>document.querySelector(q);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const chance=(p)=>Math.random()<p;
const pick=(a)=>a[Math.floor(Math.random()*a.length)];
const clone=(o)=>JSON.parse(JSON.stringify(o));
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }

/* --- state: PERMANENT (account) + PER-RUN (run). The split IS the eternal loop. --- */
function freshRun(disc, lifestyle){
  const base = startStats(disc, lifestyle);
  return {
    disc, lifestyle, tier: lifestyle==="slob"?0:1, gains:0,
    str:base.str, end:base.end, mob:base.mob, aes:0, disc_stat:0, health:30,
    sub:{str:base.str*base.str, end:base.end*base.end, mob:base.mob*base.mob}, loot:{},
    stam:STAM_MAX_BASE, cash:0, lastTick:Date.now(),

    enhanced:false, injured:false, rhabdo:false,
    buffs:[], inventory:{}, fatigue:{},
    completed:[], arenaOpen:false, bossBeaten:false,
    sqCount:{}, keys:{}, here:null, legacyAwarded:false, tierBossReady:false, cfLoop:0,
    path:null, slobClock:0, pathDone:false,
    mode:"normal", trainedToday:true, actions:0, pathFailed:false, adsToday:0,   // Phase D mode · 75-Hard daily tracker · ranked counter · soft-failed challenge path · ad-stamina diminisher
    loc:"map", enc:null, outcome:null, lastDay: todayStr(),
  };
}
const BASE={
  v:3,
  account:{
    legacy:0, mmNodes:[], mastered:[], marginal:0,

    ascensions:0, bestActions:{}, seenOnboard:false, name:"",
    badges:{}, slobDeaths:0, resolve:false, antihero:false,   // challenge-path badges + slob-death perks
    patches:0, iotm:{}, equipped:null,                         // Phase C: premium currency + Item-of-the-Month (owned, one shown off)
    boards:[],                                                 // ranked leaderboard: completed-run entries
    maxTs:0, lastRollTs:0,                                     // clock-tamper failsafe: furthest timestamp seen + last legit daily rollover
    curEvent:null, eventOverride:null,                         // active calendar event + dev override
    dayCount:0, adventStreak:0, adventClaimedDay:-1,           // monotonic day counter + New Year advent streak
    trophies:{},                                               // event-participation collectibles (cosmetic)
    gearInv:{}, gear:{},                                        // permanent wearable-gear kit: owned counts + equipped {slot:id}
    firstSeenTs:0, firstVersion:"", founder:false,              // alpha-tester tracking: when/what version they first played → "Founding Slob" perk at beta
    email:"", betaSignup:false,                                 // opt-in beta-notify list (the durable, cross-device way to recognise + reward testers)
  },
  run:null,
  settings:{theme:null},

};

let S=load();
if(!S){ S=clone(BASE); S.run=freshRun("Newbie","slob"); }
migrate();

function load(){ try{const r=localStorage.getItem(SAVE_KEY);return r?JSON.parse(r):null;}catch(e){return null;} }
function save(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){} }
function migrate(){
  if(!S.account) S.account=clone(BASE.account);
  for(const k in BASE.account) if(!(k in S.account)) S.account[k]=clone(BASE.account[k]);
  // --- alpha-tester stamp: anyone who opens the game during alpha = a Founding Slob (reward delivered at beta).
  //     Local-only (fragile), but combined with Google-Form feedback it's enough to recognise early testers. ---

  S.account.founder=true;
  if(!S.run) S.run=freshRun("Newbie","slob");
  if(!S.log) S.log=[];
  if(S.run && !S.run.lastDay) S.run.lastDay=todayStr();
  if(S.run && S.run.outcome===undefined) S.run.outcome=null;
  if(S.run && !S.run.sqCount) S.run.sqCount={};
  if(S.run && !S.run.sub) S.run.sub={str:(S.run.str||1)**2, end:(S.run.end||1)**2, mob:(S.run.mob||1)**2};
  if(S.run && !S.run.loot) S.run.loot={};
  if(S.run && !S.run.keys) S.run.keys={};
  if(S.run && S.run.here===undefined) S.run.here=null;
  if(S.run && S.run.legacyAwarded===undefined) S.run.legacyAwarded=false;
  if(S.run && S.run.tierBossReady===undefined) S.run.tierBossReady=false;
  if(S.run && S.run.cfLoop===undefined) S.run.cfLoop=0;
  if(S.run && S.run.path===undefined) S.run.path=null;
  if(S.run && S.run.slobClock===undefined) S.run.slobClock=0;
  if(S.run && S.run.pathDone===undefined) S.run.pathDone=false;
  if(S.run && S.run.adsToday===undefined) S.run.adsToday=0;
  if(S.run && !MODES[S.run.mode]) S.run.mode="normal";        // map old casual/softcore saves → normal
  if(S.run && S.run.trainedToday===undefined) S.run.trainedToday=true;
  if(S.run && S.run.actions===undefined) S.run.actions=0;
  if(S.run && S.run.pathFailed===undefined) S.run.pathFailed=false;
  if(S.account && !S.account.boards) S.account.boards=[];      // ranked leaderboard entries

  if(S.account && S.account.lastRollTs===undefined) S.account.lastRollTs=0;
  if(S.account && S.account.curEvent===undefined) S.account.curEvent=null;
  if(S.account && S.account.eventOverride===undefined) S.account.eventOverride=null;
  if(S.account && S.account.dayCount===undefined) S.account.dayCount=0;
  if(S.account && S.account.adventStreak===undefined) S.account.adventStreak=0;
  if(S.account && S.account.adventClaimedDay===undefined) S.account.adventClaimedDay=-1;
  if(S.account && !S.account.trophies) S.account.trophies={};

}

/* --- muscle-memory FLOOR: starting stats seeded from remembered peaks --- */
function startStats(disc, lifestyle){
  const a=S.account||BASE.account;
  const key=DISCIPLINES[disc].key;
  const base={str:1,end:1,mob:1};
  // own-discipline memory applies full; other stats at transfer rate
  for(const st of ["str","end","mob"]){
    const floor=a.floors[st]||0;
    const rate = (st===key)?1:FLOOR_TRANSFER_RATE;
    base[st]=1+Math.round(floor*rate*0.6); // seed a fraction of remembered peak
  }
  if(lifestyle==="slob"){ base.str=1;base.end=1;base.mob=1; } // Stay-a-Slob = true zero start
  if(_nextPath && (CHALLENGE_PATHS.find(p=>p.id===_nextPath)||{}).flags && CHALLENGE_PATHS.find(p=>p.id===_nextPath).flags.noAccel){ base.str=1;base.end=1;base.mob=1; } // From Scratch = true zero
  return base;
}
/* accelerated early tiers: cheaper if you have ANY mastery + within the floor cap */
function gainsNeeded(tier){
  const base=TIERS[tier].gains;
  const hasMemory=(S.account.mastered.length>0);
  if(pathHas("noAccel")) return base;   // From Scratch: no early-tier acceleration
  if(hasMemory && tier<=floorTierCap()) return Math.max(2,Math.round(base*FLOOR_SPEED_MULT));
  return base;
}

/* --- derived multipliers from MM nodes + global mastery multiplier --- */
function nodeHas(id){ return S.account.mmNodes.includes(id); }
function nodeSum(key){ let s=0; for(const n of allMMNodes()){ if(S.account.mmNodes.includes(n.id) && n.effect[key]) s+=n.effect[key]; } return s; }
function completedGroups(){ // synergy: a fully-owned group (shared OR class) = +5% gains
  const owned=S.account.mmNodes, groups={};
  for(const n of allMMNodes()){ (groups[n.group]=groups[n.group]||[]).push(n.id); }
  let c=0; for(const g in groups){ if(groups[g].every(id=>owned.includes(id))) c++; } return c;
}
/* infinite soft-capped Legacy sink: surplus Legacy → permanent diminishing gains (never stranded, never godlike → eternal-loop rule) */
function marginalBonus(n){ n=(n==null?(S.account.marginal||0):n); return 0.4*(1-Math.pow(0.93,n)); }
function gainMultiplier(){
  let m = 1 + nodeSum("gainMult")             // MM node gains perks
        + 0.05*S.account.mastered.length       // global Legacy multiplier (③)
        + 0.05*completedGroups()               // synergy bonus
        + marginalBonus()                       // Marginal Gains infinite sink
        + (pathHas("gasBonus")?0.25:0)          // All Gas No Brakes: +25% (you glass cannon)
        + (S.account.resolve?0.10:0)            // slob-death "Resolve" perk (permanent)
        + eventGain()                           // active calendar event perk/penalty
        + gearSum("gain");                      // equipped wearable gear
  for(const b of S.run.buffs) if(b.gainMult) m+=b.gainMult;
  return Math.max(0.1, m);
}
function stamCap(){ return STAM_MAX_BASE + 100 + nodeSum("stamCap") + gearSum("stam"); } // bank to ~150+
function overResist(){ return Math.min(0.7, nodeSum("overResist") + gearSum("over")); }
function floorTierCap(){ return FLOOR_TIER_CAP + nodeSum("floorTierBonus"); }

/* --- rotation (v0.4.0): 5-deep anti-streak queue per context — never a recent repeat (KoL's queue) --- */
const _lineHist={};
function line(ctx){
  const pool=COACH_LINES[ctx]||RESULT_LINES[ctx]||["…"];
  const hist=_lineHist[ctx]||(_lineHist[ctx]=[]);
  let l=pick(pool), tries=0;
  while(pool.length>1 && hist.includes(l) && tries++<16) l=pick(pool);
  hist.push(l); while(hist.length>Math.min(5,pool.length-1)) hist.shift();
  return l;
}
function coachSay(ctx){ const w=$("#coach-who"); if(w) w.textContent=speakerName(); $("#coach-say").textContent = line(ctx); }

/* --- log --- */
function logLine(cls,html){ S.log.unshift({c:cls,h:html}); if(S.log.length>60)S.log.pop(); }

/* --- time / stamina regen + meter decay --- */
function tick(){
  const r=S.run, a=S.account, now=Date.now(), today=todayStr();
  /* CLOCK-TAMPER FAILSAFE (client-side mitigation; the real fix = server-authoritative time, arrives w/ backend):
     a daily rollover counts only if (a) time hasn't jumped BACKWARD from the furthest point we've seen — a
     set-clock-back is caught and self-heals once real time passes maxTs again — AND (b) ≥18h of (forward)
     time has passed since the last legit rollover, which blocks toggling the date to farm refills in one day. */
  const DAY_MS=18*3600*1000, TOL=120000;
  const newDay = r.lastDay!==today;
  const legitTime = now >= (a.maxTs||0)-TOL && (now-(a.lastRollTs||0))>=DAY_MS;
  if(newDay && legitTime){
    r.lastDay=today; a.lastRollTs=now; r._clockWarned=false; a.dayCount=(a.dayCount||0)+1;
    r.stam=Math.min(stamCap(), r.stam + STAM_MAX_BASE);   // grant a full day, bank to cap
    r.meters.over=clamp(r.meters.over-30,0,100);
    r.meters.screen=clamp(r.meters.screen-40,0,100);
    r.meters.subs=clamp(r.meters.subs-20,0,100);
    r.meters.full=0;
    r.adsToday=0;   // ad-stamina diminishing returns reset each day
    maybeRotateEvent();   // events run on the compressed calendar
    if(pathHas("dailyOrDie") && !r.trainedToday){ a.maxTs=Math.max(a.maxTs||0,now); failChallenge("The 75 Hard-O: you missed a day. The whole thing resets. Those are the rules — you knew them."); return; }
    r.trainedToday=false;   // new day: must train again (75 Hard-O)
    if(r.health<30) r.health=clamp(r.health+15,0,30);
    logLine("gold","🌅 A new day. Stamina replenished. The world resets — you don't (you keep your gains).");
  } else if(newDay && now < (a.maxTs||0)-TOL && !r._clockWarned){
    r._clockWarned=true;   // clock set backward → no free day until real time catches up
    logLine("lose","⏰ Your device clock jumped backwards. Nice try — no free day. Real time has to catch up first.");
  }
  a.maxTs=Math.max(a.maxTs||0, now);
  if(r.injured && r.meters.over<40){ r.injured=false; if(!r.rhabdo) logLine("sys","🙂 Rested up. You can train again."); }
  if(r.rhabdo && r.meters.over<40 && r.health>=20){ r.rhabdo=false; r.injured=false; logLine("sys","🙂 Uncle Rhabdo has left the building. Hydrate. Never again. (You will.)"); }
  const el=$("#regen");
  if(el) el.textContent = r.stam>0 ? "⚡ Stamina refills fully at the start of each new day." : "Out of stamina — come back tomorrow, watch an ad, or rest.";
}

/* --- meters: liver-gamble on `subs` (enhanced), others hard walls --- */
function addMeter(which,amt){
  const r=S.run;
  if(which==="over") amt*=(1-overResist());
  if(which==="subs"){
    r.meters.subs+=amt; r.enhanced=true;
    if(r.meters.subs>=100){ // push PAST the cap = burst then crash
      r.meters.subs=60; addMeter("over",15); r.health=clamp(r.health-12,0,30);
      logLine("lose","💊 Peptide overdose. Big burst, bigger crash. Health tanked. The Open league salutes you.");
    }
    return;
  }
  r.meters[which]=clamp(r.meters[which]+amt,0,100);
  if(which==="full" && r.meters.full>=100 && pathHas("cutting")) failPathSoft("The diet's blown — Fullness maxed out. The abs retreat into legend.");
  if(which==="over" && r.meters.over>=90 && chance(.4)) doRhabdo();
}
function doRhabdo(){ const r=S.run; r.rhabdo=true; r.injured=true; r.health=clamp(r.health-10,0,30);
  logLine("lose", bossFinish(r.disc,"rhabdo") || "💀 UNCLE RHABDO. You overcooked it. Forced rest until you recover.");
  if(pathHas("glassCannon")) failChallenge("All Gas No Brakes, and the brakes were never installed. One injury. One ending."); }

/* --- challenge-path SOFT fail: the constraint is blown but the RUN continues — you just forfeit the badge/bonus. --- */
function failPathSoft(reason){ const p=pathDef(); if(!p || S.run.pathFailed) return; S.run.pathFailed=true; logLine("lose",`💔 CHALLENGE FAILED — <b>${p.em} ${p.name}</b>: ${reason} The run goes on, but there's no badge or bonus this time.`); coachSay("slacked"); }
/* --- challenge-path HARD failure: the constraint ENDS this life (account progress kept, no badge) --- */
function failChallenge(reason){
  const p=pathDef();
  logLine("lose", `💥 CHALLENGE FAILED${p?` (${p.name})`:""}. ${reason}`);
  showModal(`<h3>💥 Run Over</h3>${SKETCH.make({pose:"slob"})}
    <p class="flav">${reason}</p>
    <p class="tiny">${p?`The <b>${p.em} ${p.name}</b> path shows no mercy. No badge this time — the constraint won. Your account progress stays; this life does not.`:""}</p>
    <div style="margin-top:10px"><button data-act="failReincarnate">↩︎ Reincarnate (fresh start, no path)</button></div>`);
}

/* --- SLOB DEATH (v0.4.0) — the hidden anti-progression path. Commit to sloth as a tier-0 slob and you
   rot: the slob-clock ticks, health drains, doomscroll maxes the screen. Death is the only exit — and
   it's redemptive comedy: God grants a second chance + a perk. (Gated off the Newbie onboarding.) --- */
const SLOB_GOD_LINES = [
  "God sighs audibly. 'Again? Fine. But I'm watching the step count this time.'",
  "'You had ONE job: not be horizontal.' A heavenly facepalm. Back you go.",
  "God mutters something about free will and reincarnates you anyway.",
  "'The gym is RIGHT THERE.' A divine eye-roll. Second chance granted, reluctantly.",
  "God consults a very long clipboard, finds your name, and sighs at the tally.",
  "'I made you a temple. You used it as a beanbag.' Reincarnation processing…",
];
function maybeSlobDeath(){ const r=S.run; if(r.lifestyle!=="slob"||r.tier!==0||r.disc==="Newbie") return;
  if(r.slobClock===8) logLine("lose","🛋️ The couch is winning. You can feel yourself becoming furniture. (Do a workout — or perish.)");
  if(r.health<=0 || r.meters.screen>=100 || r.slobClock>=14) slobDeath(); }
function slobDeath(){
  const a=S.account; a.slobDeaths++;
  let perkMsg;
  if(a.slobDeaths>=100 && !a.antihero){ a.antihero=true; perkMsg="One hundred deaths. God stops arguing entirely. You unlock <b>Weaponized Laziness</b> (anti-hero). Somehow, this is a reward."; }
  else if(a.slobDeaths===1 && !a.resolve){ a.resolve=true; perkMsg="God, merciful, grants a second chance — and <b>Resolve</b> (+10% gains, permanent). 'Please. Just… move. A little.'"; }
  else perkMsg=pick(SLOB_GOD_LINES);
  showModal(`<h3>⚰️ You Have Perished (on the couch)</h3>${SKETCH.make({pose:"slob"})}
    <p class="flav">Death #${a.slobDeaths}. The couch claims another. You didn't die doing what you loved — you died doing nothing, which was, to be fair, exactly what you loved.</p>
    <p class="tiny">${perkMsg}</p>
    <div style="margin-top:10px"><button data-act="slobReincarnate">↩︎ Reincarnate (and maybe do ONE push-up this time)</button></div>`);
}

/* --- gains & tier-up --- */
function addGains(x){
  const r=S.run;
  x = Math.max(0, Math.round(x*gainMultiplier()));
  r.gains+=x;   // hidden effort pool (flavor + muscle-mem feed). Tier-up now comes from the KEY-SET, not this number (GAP-B fix).
  return x;
}

/* --- hidden substat pool (v0.4.0): progress GUARANTEED every click; visible stat = floor(√pool),
   so it always fills and pops occasionally (KoL floor-√). Fixes the inversion bug: progress is the
   floor, stat-pops/loot are the variance — never the other way around. --- */
function bankStat(st, amt){
  const r=S.run;
  if(!r.sub) r.sub={str:(r.str||1)**2,end:(r.end||1)**2,mob:(r.mob||1)**2};
  r.sub[st]=(r.sub[st]||0)+amt;
  const nv=Math.floor(Math.sqrt(r.sub[st]));
  const popped = nv>(r[st]||0);
  if(popped) r[st]=nv;
  return popped;
}
/* --- loot: 1–3 independent pulls, named tangible drops; +loot% is a build-toward knob (buffs) --- */
function lootPct(){ let p=0.55+eventLoot(); for(const b of S.run.buffs) if(b.lootPct) p+=b.lootPct; return Math.min(0.95,Math.max(0,p)); }
/* zone-weighted drop: each location is a "zone" with its own signature items (COMBAT-LOOT canon) —
   ~55% of drops pull from the current location's table, the rest from the global junk pool. */
function pickLoot(){
  const pool=LOOT.filter(it=>!it.event && !it.wh && !it.slot);   // normal training = non-gear junk only
  const zoneItems=pool.filter(it=>it.zone===S.run.here);
  if(zoneItems.length && chance(.55)) return pick(zoneItems);
  return pick(pool);
}
function whItems(rar){ return LOOT.filter(it=>it.wh && (it.rarity||0)===rar); }   // warehouse pools by rarity (also the "wild" rares for roam)
function grantItem(it){ if(!it) return; if(it.slot){ S.account.gearInv[it.id]=(S.account.gearInv[it.id]||0)+1; } else { S.run.loot[it.id]=(S.run.loot[it.id]||0)+1; } return it; }   // gear → permanent kit; junk → per-run stash
/* --- DOOMSCROLL (the Feed's one real use): an ad buys STAMINA; doomscrolling buys the CHANCE of a FIND
   (loot / a cash lead) that training never surfaces — the distinct niche that makes "scroll vs ad" a real
   decision about what you're spending screen-time ON. Still mostly a trap. winText/loseText = per-venue flavor. */
function doomscroll(screenAmt, winText, loseText){
  const resist=nodeHas("ironDiscipline");
  addMeter("screen", resist?Math.max(2,Math.round(screenAmt*0.45)):screenAmt);
  const r=Math.random();
  if(r<0.16){ const it=grantItem(pickLoot()); addGains(1);
    logLine("win", `${winText} <b>And the scroll actually coughed up something real:</b> ${it?it.em+" "+it.name:"a scrap"} — straight into the stash.`); }
  else if(r<0.28){ const c=3+Math.floor(Math.random()*6); S.run.cash+=c;
    logLine("win", `${winText} <b>You also stumbled onto a genuine lead: +$${c}.</b> The algorithm giveth, rarely.`); }
  else if(r<0.50){ addGains(2); logLine("win", winText); }
  else { logLine("lose", loseText); }
  coachSay("slacked"); afterAction();
}
/* --- DeluluApple Warehouse Sale: the MMO grind-zone. Each 1⚡ dive is a lottery — 0.01% legendary,
   0.1% rare, some junk/cash, mostly a bruise. The tiny odds ARE the hook (one more dive…). --- */
const WAREHOUSE_MISS=[
  "📦 Elbow-deep in knockoff leggings. Nothing but lint and the faint smell of plastic.",
  "📦 You surfaced holding a single non-matching sock. It wasn't even in the pile. Unsettling.",
  "📦 Dug for ten minutes and found the bottom. The bottom is just more boxes. Infinite boxes.",
  "📦 Another diver beat you to it by half a second. You locked eyes. You both knew. No words.",
  "📦 Empty-handed, mildly bruised, strangely exhilarated. One more dive. Just one more.",
  "📦 Grabbed something promising — a mannequin's forearm. Not for sale. You apologise and re-bury it.",
];
function warehouseDive(){
  const r=S.run; if(r.stam<1){ logLine("lose","😮‍💨 Too exhausted to dive back in. Rest — the pile isn't going anywhere."); afterAction(false); return; }
  r.stam-=1; const roll=Math.random(); let cls="lose", pose="slob", msg;
  if(roll<0.001){ const it=grantItem(pick(whItems(3))); cls="win"; pose="flex"; msg=`🤯 UNDER A LANDSLIDE OF PHONE CASES — ${it.em} <b style="color:${RARITY[3].col}">${it.name}</b> <span class="tiny">(LEGENDARY GEAR · 0.1%!)</span>. You scream. A crowd gathers. → equip it in 🎽 Gear. WORTH IT.`; }
  else if(roll<0.011){ const it=grantItem(pick(whItems(2))); cls="win"; pose="flex"; msg=`✨ Buried in the bargain bin — ${it.em} <b style="color:${RARITY[2].col}">${it.name}</b> <span class="tiny">(RARE GEAR · 1%)</span>. A real score → 🎽 Gear.`; }
  else if(roll<0.06){ const it=grantItem(pick(whItems(1))); cls="sys"; pose="idle"; msg=`🧦 Dug out ${it.em} ${it.name} <span class="tiny">(common gear)</span> — a slot-filler for your kit → 🎽 Gear.`; }
  else if(roll<0.20){ const it=grantItem(pick(whItems(0))); cls="sys"; pose="idle"; msg=`📦 Dug out ${it.em} ${it.name}. Not glamorous — but junk sells, and the dream lives on.`; }
  else if(roll<0.30){ const c=1+Math.floor(Math.random()*4); r.cash+=c; cls="sys"; pose="idle"; msg=`💵 Found $${c} wedged in a donated jacket. Technically the warehouse's. Finders keepers.`; }
  else { msg=pick(WAREHOUSE_MISS); }   // miss — costs stamina only; rummaging a bargain pile isn't training (no overtrain)
  logLine(cls,msg); coachSay(cls==="win"?"trainedWell":"slacked"); afterAction({pose});
}
function warehouseDive5(){
  const r=S.run; if(r.stam<5){ logLine("lose","😮‍💨 Need 5⚡ to dig in earnest."); afterAction(false); return; }
  const found=[]; let cash=0, best=0;
  for(let i=0;i<5;i++){ r.stam-=1; const roll=Math.random();
    if(roll<0.001){ found.push(grantItem(pick(whItems(3)))); best=3; }
    else if(roll<0.011){ found.push(grantItem(pick(whItems(2)))); best=Math.max(best,2); }
    else if(roll<0.06){ found.push(grantItem(pick(whItems(1)))); best=Math.max(best,1); }
    else if(roll<0.20){ found.push(grantItem(pick(whItems(0)))); best=Math.max(best,1); }
    else if(roll<0.30){ const c=1+Math.floor(Math.random()*4); r.cash+=c; cash+=c; }
    // else: a miss — stamina only, no overtrain (digging isn't training)
  }
  const txt = found.length? `Pulled out: ${found.map(it=>it.em+" "+it.name).join(", ")}${cash?` + $${cash}`:""}.` : (cash?`Just $${cash} and a lot of lint.`:"Five dives, nothing but boxes and regret. The pile endures.");
  logLine(best>=2?"win":"sys", `🤿 Dug through five armfuls. ${txt}`); coachSay(best>=2?"trainedWell":"slacked"); afterAction({pose:best>=2?"flex":"idle"});
}
/* --- RANDOM ROAM ENCOUNTERS: ~8% of map clicks spring a surprise challenge — a stat check for cash + a

function openRoam(){ const e=pick(ROAM_ENCOUNTERS); S.run._roam=e.id;
  showModal(`<h3>❗ ${e.name}</h3>${e.foe?SKETCH.foe(e.foe):SKETCH.make(e.sketch||{pose:"idle"})}
    <p class="flav">${e.flav}</p>
    <p class="tiny">A sudden <b>${e.stat.toUpperCase()}</b> moment. Take it on for a shot at a rare find?</p>
    <div style="margin-top:8px"><button data-act="roamEngage">⚔️ Take it on (2⚡)</button>
    <button data-act="closeModal">🚶 Walk away</button></div>`); }
function roamEngage(){
  const e=ROAM_ENCOUNTERS.find(x=>x.id===S.run._roam)||ROAM_ENCOUNTERS[0], r=S.run;
  if(r.stam<2){ logLine("lose","😮‍💨 Too tired to take it on. It passes."); closeModal(); render(); return; }
  r.stam-=2;
  const buffPts=r.buffs.reduce((a,x)=>a+(x.gainMult?Math.round(x.gainMult*10):0),0);
  const might=(usesBestStat(r.disc)?Math.max(r.str,r.end,r.mob):(r[e.stat]||1))+buffPts+gearSum("might"), target=4+r.tier*1.5;
  const won=might*(0.7+Math.random()*0.7)>=target; let msg;
  if(won){ const c=8+r.tier*2; r.cash+=c; addGains(4); const roll=Math.random(); let drop;
    if(roll<0.02) drop=pick(whItems(3)); else if(roll<0.18) drop=pick(whItems(2));
    if(drop){ grantItem(drop); const rr=RARITY[drop.rarity]; msg=`✅ ${e.win}<br>+$${c} — and ${drop.em} <b style="color:${rr.col}">${drop.name}</b> <span class="tiny">(${rr.name})</span>! A rare find from a chance encounter.`; }
    else msg=`✅ ${e.win}<br>+$${c} and some gains. No rare this time, but worth the detour.`; }
  else { addMeter("over",6); msg=`❌ ${e.lose}`; }
  showModal(`<h3>❗ ${e.name}</h3>${e.foe?SKETCH.foe(e.foe,{gold:won}):SKETCH.make({pose:won?"flex":"slob"})}
    <p class="${won?'q-done':'lose'}">${msg}</p><div style="margin-top:8px"><button data-act="closeModal">${won?'Nice':'Ow'}</button></div>`);
  coachSay(won?"bossWin":"bossLose"); save();
}
function lootRoll(){
  const r=S.run, got=[]; if(!r.loot) r.loot={};
  const rolls = 1 + (chance(.5)?1:0) + (chance(.22)?1:0);
  for(let i=0;i<rolls;i++){ if(chance(lootPct())){ const it=pickLoot(); r.loot[it.id]=(r.loot[it.id]||0)+1; got.push(it); } }
  return got;
}
/* --- living inventory: autosell loot for cash (makes the Stash matter; one-way real-economy-safe) --- */
/* RARITY — Junk is vendor-trash (autosell → training cash). Rare/Legendary are keepers you'd list on
   Carouhell (Phase E). Signalled by colour + a word (aligns w/ COMBAT-LOOT canon "signal via art colour"). */
const RARITY = {0:{name:"Junk",col:"#9a948c"},1:{name:"Common",col:"#5f8f6a"},2:{name:"Rare",col:"#3a6ea5"},3:{name:"Legendary",col:"#c08a00"}};
/* --- WEARABLE GEAR (RPG inventory) — 8 slots, perks apply while equipped; kit is permanent (account). --- */
const GEAR_SLOTS=[["head","Head"],["bag","Bag"],["neck","Neck"],["shirt","Shirt"],["lhand","Left hand"],["rhand","Right hand"],["pants","Pants"],["shoes","Shoes"]];
const PERK_LABEL={stam:"stamina",gain:"gains",over:"injury/overtrain resist",might:"might (fights)",aes:"aesthetics"};
function gearItem(id){ return LOOT.find(x=>x.id===id && x.slot); }
function gearOwned(id){ const it=gearItem(id); if(!it) return false; if(it.patchGear) return S.account.patches>=1; return (S.account.gearInv[id]||0)>0; }   // Patch-badge is "owned" whenever you hold a Patch
function gearForSlot(slot){ return LOOT.filter(it=>it.slot===slot && gearOwned(it.id)); }
function gearSum(key){ let s=0; const g=S.account.gear||{}; for(const sl in g){ const it=gearItem(g[sl]); if(it&&it.perk&&it.perk[key]) s+=it.perk[key]; } return s; }
function perkStr(perk){ return Object.keys(perk||{}).map(k=>`${perk[k]>0?"+":""}${k==="gain"||k==="over"?Math.round(perk[k]*100)+"%":perk[k]} ${PERK_LABEL[k]||k}`).join(", "); }
function itemRarity(id){ const it=LOOT.find(x=>x.id===id); return it?(it.rarity||0):0; }
function eventDropIds(rar){ return LOOT.filter(it=>it.event && (it.rarity||0)===rar).map(it=>it.id); }
function isTradeable(id){ return itemRarity(id)>=2; }   // rare+ = Carouhell-worthy keepers
function stashValue(onlyJunk){ const r=S.run; return Object.keys(r.loot||{}).reduce((a,id)=>{ const it=LOOT.find(x=>x.id===id); if(!it)return a; if(onlyJunk&&(it.rarity||0)>0)return a; return a+it.sell*r.loot[id]; },0); }
function canSell(){ if(!economyOpen()){ logLine("lose","🔒 Hardcore: the economy's sealed until you beat the run. Earn it the hard way."); openStash(); return false; } return true; }
function sellLoot(id){ const r=S.run, it=LOOT.find(x=>x.id===id), n=r.loot[id]||0; if(!it||n<=0) return; if(!canSell()) return; const cash=it.sell*n; r.cash+=cash; delete r.loot[id]; logLine("win",`💰 Sold ${n}× ${it.em} ${it.name} → +$${cash}.`); save(); openStash(); }
function sellAllLoot(){ const r=S.run; if(!canSell()) return;   // sells JUNK only — keeps your rare/legendary tradeables
  const junk=Object.keys(r.loot||{}).filter(id=>r.loot[id]>0 && itemRarity(id)===0);
  if(!junk.length){ logLine("sys","🎒 No junk to clear — only keepers left."); openStash(); return; }
  let got=0; for(const id of junk){ const it=LOOT.find(x=>x.id===id); if(it){ got+=it.sell*r.loot[id]; delete r.loot[id]; } }
  r.cash+=got; logLine("win",`💰 Autosold all junk → +$${got}. One man's sweaty trash is another man's deadlift fund. (Rares kept.)`); save(); openStash(); }
/* --- premium economy actions (Phase C) — Patch = REAL MONEY ONLY; resale (Carouhell) = Phase E --- */
function buyPatchReal(){ S.account.patches++; logLine("gold","⭐ (Simulated $10) A <b>Fitness is my Passion Patch</b> is yours. Deterministic — exactly what you paid for, no loot box. On Carouhell (coming later) you'll be able to resell it to other players for in-game cash."); save(); openPatchShop(); }
function redeemIotm(id){ const it=iotmById(id); if(!it) return; if(S.account.iotm[id]){ logLine("sys","Already owned — IotM is one-per-account, bound forever."); openPatchShop(); return; } if(S.account.patches<1){ logLine("lose","⭐ No Patches. A Patch comes from real money — or from another player via Carouhell (coming later)."); openPatchShop(); return; } S.account.patches--; S.account.iotm[id]=true; logLine("gold",`🎁 Redeemed <b>${it.em} ${it.name}</b> (${it.season}) — a cosmetic flex, bound to you forever. Never tradable.`); save(); openPatchShop(); }
function equipIotm(id){ if(!S.account.iotm[id]) return; S.account.equipped=(S.account.equipped===id?null:id); const it=iotmById(id); logLine("sys", S.account.equipped?`🎖️ Showing off <b>${it.name}</b>.`:"🎖️ Badge hidden."); save(); openPatchShop(); }

/* --- light training (Layer 1 combat) --- */
function train(opts){
  const r=S.run;
  if(r.injured){ logLine("lose","🤕 You're injured. Rest first (Home → rest day)."); render(); return; }
  if(pathHas("oneLift") && opts.stat!==DISCIPLINES[r.disc].key){ logLine("lose",`🏋️ One-Lift Wonder: ${DISCIPLINES[r.disc].key.toUpperCase()} only. That's a distraction and you know it.`); render(); return; }
  if(r.stam<opts.cost){ logLine("lose","😮‍💨 Not enough stamina."); render(); return; }
  r.stam-=opts.cost;
  r.trainedToday=true;   // 75 Hard-O: you showed up today
  const key=opts.stat;
  const fat=r.fatigue[opts.id]||0; r.fatigue[opts.id]=fat+1;
  addMeter("over", opts.hardness*(1.5+fat*1.2));
  // EVERY click pays: guaranteed tier-gains + guaranteed hidden substat (pops the visible stat sometimes)
  // + maybe loot + ALWAYS a joke. No click pays nothing anymore (the inversion fix).
  const g=opts.base*(fat>2?0.6:1)*(BODYWEIGHT_IDS.has(opts.id)?BW_MULT:1);   // bodyweight < equipment
  const got=addGains(g);
  const popped=bankStat(key, Math.max(1,Math.round(g)));
  if(key==="str"&&chance(.4)) r.aes++;
  if(pathHas("cutting")&&popped) r.aes++;   // The Cutting Phase: definition on every win
  let offMsg="";
  if(isOffPath(key)){ const ms=DISCIPLINES[r.disc].key;        // off-path = the knowing trade
    const soften=1-Math.min(0.8,nodeSum("offPathResist"));     // MM perk (e.g. Economy of Motion) softens the bleed
    if(r.sub[ms]>1){ r.sub[ms]=Math.max(1, r.sub[ms]-Math.round(g*1.5*soften)); const nv=Math.floor(Math.sqrt(r.sub[ms])); if(nv<(r[ms]||0)) r[ms]=nv; }
    addMeter("over",6*soften);                                 // off-path gasses you faster (softened by MM)
    offMsg=` <span class="tiny">⚠️ Off-path for a ${r.disc}: +${key.toUpperCase()}, but your ${ms.toUpperCase()} slips and you gas faster.${soften<1?" (eased by muscle memory)":""} ${classProfile().warn}</span>`;
  }
  const drops=lootRoll();
  const flavor=line("rep");
  coachSay(popped?"trainedWell":"trainedPoor");
  const dropTxt=drops.length?` <br>🎁 Found: ${drops.map(d=>d.em+" "+d.name).join(", ")}.`:"";
  logLine(drops.length||popped?"win":"sys",
    `${opts.label} — +${got} gains${popped?`, +1 ${key.toUpperCase()}`:""}. <i>${flavor}</i>${fat>2?" (Grinding nonstop — returns thinning, overtrain rising.)":""}${dropTxt}${offMsg}`);
  if(r.meters.over>=90 && chance(.35)) doRhabdo();
  tickKeys("train",{loc:S.run.here,id:opts.id,stat:key,popped}); if(drops.length) tickKeys("loot",{items:drops});
  afterAction({pose: r.injured?"slob":(key==="end"?"run":(popped?"flex":"squat"))});
}

/* --- TIER TRIAL (mini-boss each tier): class-adaptive STAT CHECK. Keys = the work; this = the proof.
   Target scales with tier; your "might" = your class's KEY STAT + prepped buffs. Under-built → you can lose
   → go train (stat grows unbounded, so grinding always eventually wins). This is the real lose-condition. --- */
function trialMight(){ const r=S.run, b=r.buffs.reduce((a,x)=>a+(x.gainMult?Math.round(x.gainMult*10):0),0);
  return (usesBestStat(r.disc)?Math.max(r.str,r.end,r.mob):(r[DISCIPLINES[r.disc].key]||0))+b+nodeSum("trialBonus")+gearSum("might"); }   // best-stat for Newbie/CrossFit; +MM trial perks
function openTierBoss(){
  const r=S.run, kn=(usesBestStat(r.disc)?"BEST STAT":DISCIPLINES[r.disc].key.toUpperCase());
  const might=trialMight(), target=4+r.tier*2, next=tierName(r.disc,r.tier+1);
  let beats=0, lines=[];
  for(let i=0;i<3;i++){ const roll=might*(0.75+Math.random()*0.6), ok=roll>=target; if(ok)beats++;
    lines.push(`Beat ${i+1}: ${ok?"clean":"shaky"} (${Math.round(roll)} vs ${target})`); }
  const won=beats>=2;
  showModal(`<h3>⚔️ Tier Trial — becoming "${next}"</h3>${SKETCH.foe("council",{gold:won})}
    <p class="flav">The Council sizes you up — a <b>${kn}</b> check. Prove the work was real.</p>
    <p class="tiny">Your ${kn} + prepped buffs = <b>${might}</b> vs the bar <b>${target}</b>:</p>
    <p>${lines.join("<br>")}</p>
    <p class="${won?'q-done':'lose'}"><b>${won?`PASSED — welcome to ${next}.`:`Not today. ${kn} ${might} vs bar ${target}. Put in more work and come back.`}</b></p>
    ${won?`<p class="flav">${bossFinish(r.disc,"win")}</p>`:""}
    <div style="margin-top:10px"><button data-act="${won?'tierWon':'closeModal'}">${won?'Continue':'Back to training'}</button></div>`);
  if(won) certify(); else coachSay("bossLose");
}

/* --- COMPETITION boss (Layer 2): ~3 dramatic beats, HP-depletion, buffs decisive --- */
function openBoss(){
  const d=DISCIPLINES[S.run.disc], stat=d.boss.stat, isCF=S.run.disc==="CrossFit", loop=S.run.cfLoop||0;
  const buffPts=S.run.buffs.reduce((a,b)=>a+(b.gainMult?Math.round(b.gainMult*10):0),0);
  const your=(usesBestStat(S.run.disc)?Math.max(S.run.str,S.run.end,S.run.mob):(S.run[stat]||1))+Math.floor(S.run.tier*1.2)+buffPts+nodeSum("trialBonus")+gearSum("might");
  const target=4+S.run.tier*2 + (isCF?loop*4:0); // CrossFit loop-boss escalates each Run-It-Back
  let beats=0, lines=[];
  for(let i=0;i<3;i++){
    const roll=your*(0.7+Math.random()*0.7);
    if(roll>=target){ beats++; lines.push(`Beat ${i+1}: nailed it. (${Math.round(roll)} vs ${target})`); }
    else lines.push(`Beat ${i+1}: shaky. (${Math.round(roll)} vs ${target})`);
  }
  const won=beats>=2;
  const winHead = isCF ? `Uncle Rhabdo hits the deck — loop #${loop+1} survived.` : "VICTORY — you are THE GOAT.";
  const body=`<h3>⚔️ ${d.boss.name}${isCF&&loop?` <span class="tiny">(loop ${loop+1})</span>`:""}</h3>${SKETCH.foe(d.boss.foe||"ego",{gold:true})}
    <p class="flav">${d.boss.line}</p>
    <p class="tiny">Your ${usesBestStat(S.run.disc)?"BEST STAT":stat.toUpperCase()} + tier + prepped buffs = <b>${your}</b> vs standard <b>${target}</b>. Three beats:</p>
    <p>${lines.join("<br>")}</p>
    <p class="${won?'q-done':'lose'}"><b>${won?winHead:"Not today. Prep more buffs and come back."}</b></p>
    ${won?`<p class="flav">${bossFinish(S.run.disc,"win")}</p>`:""}
    <div style="margin-top:10px">${won
      ? (isCF
         ? `<p class="tiny">He'll be back. He's always back. What now?</p>
            <button data-act="cfRegress">🧘 Regress — take the vibes (+CrossFitter Legacy)</button>
            <button data-act="cfRunItBack">🔁 Run It Back — escalate the chaos (harder Rhabdo, bigger rewards)</button>`
         : `<button data-act="bossWon">Continue</button>`)
      : `<button data-act="closeModal">Back</button>`}</div>`;
  showModal(body);
  coachSay(won?"bossWin":"bossLose");
  if(won){ S.run.bossBeaten=true; }

/* --- ascension / regress --- */
function worldOpen(){ return S.run.tier>=2; } // the world (map) unlocks at Tier 2 — first run is couch-only
function maxTier(){ return (S.run && S.run.disc==="Newbie") ? 8 : 12; }  // Newbie caps at 9 tiers (0..8)
function canAscend(){ return S.run.bossBeaten && S.run.tier>=maxTier(); }
/* bank this run's Legacy the moment you reach the regress screen (once), so it's spendable right there */
function awardRunLegacy(){
  if(S.run && !S.run.legacyAwarded){ S.account.legacy += (S.run.enhanced?1:2) + nodeSum("legacyBonus") + (S.run.disc==="CrossFit"?1:0) + (modeDef().legacy||0); S.run.legacyAwarded=true; }  // +CrossFitter bonus +mode bonus
  const p=pathDef();   // challenge-path COMPLETION bonus (only if the run finished = boss beaten AND the path wasn't failed)
  if(p && S.run.bossBeaten && !S.run.pathDone && !S.run.pathFailed){ S.account.legacy+=p.legacy; S.account.badges[p.badge]=(S.account.badges[p.badge]||0)+1; S.run.pathDone=true; logLine("gold",`🏅 CHALLENGE COMPLETE: <b>${p.em} ${p.name}</b> → +${p.legacy} Legacy and the <b>${p.badge}</b> badge. Respect earned the hard way.`); }
}
/* fresh entry into the Regress screen — reset the per-regress choices ONCE here (NOT inside
   openAscension, which re-renders on every pick and must preserve what's already selected). */

  _nextPath=null; _nextMode="normal";
  _nextDisc=(S.run && S.run.disc && S.run.disc!=="Newbie") ? S.run.disc : "Bodybuilding";   // default to current class, never silently Running

}

    <p class="flav">${line("ascend")}</p>
    <p class="tiny">This run: <b>${S.run.enhanced?"Enhanced":"Natty"}</b> → earned <b>+${legGain} Legacy</b>${S.run.enhanced?"":" (natty pays more)"}, banked below. Mastered so far: ${a.mastered.length} → global <b>+${5*a.mastered.length+5}%</b> gains next life.</p>
    <hr>
    <p><b>1 · Spend Legacy on Muscle Memory</b> <span class="pill">Legacy: ${a.legacy}</span></p>
    <div id="nodechoice">${nodeList}</div>
    <button data-act="buyMarg" data-v="asc" ${a.legacy>=1?"":"disabled"}>🔩 Marginal Gains <span class="tiny">(rank ${a.marginal||0} · +${(marginalBonus()*100).toFixed(0)}% total) — 1 Legacy, repeatable forever</span></button>
    <p style="margin-top:10px"><b>2 · Choose your next life</b></p>
    ${cfTease}
    <div>${discOpts}</div>

    <div>
      <button data-act="setPath" data-v="none"${!_nextPath?' class="sel"':''}>None (standard)</button>
      ${CHALLENGE_PATHS.map(p=>`<button data-act="setPath" data-v="${p.id}" title="${p.desc}"${_nextPath===p.id?' class="sel"':''}>${p.em} ${p.name}</button>`).join("")}

    <p style="margin-top:10px"><b>4 · Access mode</b> <span class="tiny">(harder access = bonus Legacy)</span></p>
    <div>${Object.keys(MODES).map(k=>`<button data-act="setMode" data-v="${k}" title="${MODES[k].desc}"${_nextMode===k?' class="sel"':''}>${MODES[k].em} ${MODES[k].name}${MODES[k].legacy?` (+${MODES[k].legacy})`:""}</button>`).join("")}</div>
    <p class="tiny" id="ascmode">${(()=>{const md=MODES[_nextMode]||MODES.normal;return `Mode: <b>${md.em} ${md.name}</b> — <span class="tiny">${md.desc}</span>`;})()}</p>

let _nextDisc = "Running / Triathlon";
function _buyNode(id){
  if(S.account.legacy<1) return false;
  if(S.account.mmNodes.includes(id)) return false;
  S.account.mmNodes.push(id); S.account.legacy-=1;
  const n=mmNodeById(id);
  logLine("gold",`🧠 Muscle Memory banked: <b>${n.name}</b>.`);
  save(); render(); return true;
}
function pickNode(id){ if(_buyNode(id)) openAscension(); }
function buyNodeMM(id){ _buyNode(id); openMM(); }
function buyMarginal(){ if(S.account.legacy<1) return false; S.account.legacy--; S.account.marginal=(S.account.marginal||0)+1; logLine("gold",`🔩 Marginal Gains → rank ${S.account.marginal} (+${(marginalBonus()*100).toFixed(0)}% total gains). The grind compounds, barely.`); save(); render(); return true; }
/* the Muscle Memory TREE — viewable + spendable anytime (Legacy earned at ascension) */
function openMM(){
  const a=S.account, groups={};
  const curClass = (S.run && S.run.disc) || null;
  const shown = MM_NODES.concat(classMMFor(curClass));           // shared + current class's perms
  for(const n of shown){ (groups[n.group]=groups[n.group]||[]).push(n); }
  // perks banked in PAST lives (other classes) still active but not buyable here
  const shownIds = new Set(shown.map(n=>n.id));
  const bankedElsewhere = a.mmNodes.filter(id=>!shownIds.has(id)).length;
  const canBuy=a.legacy>=1;
  let html=`<h3>🧠 Muscle Memory</h3>
    <p class="tiny">Permanent perks that survive every regression — the reason each new life starts stronger. Spend <b>Legacy</b> (earned by ascending; natty pays more). Complete a whole group for a synergy bonus.</p>
    <p><span class="pill">Legacy: ${a.legacy}</span> <span class="pill">Mastered: ${a.mastered.length} → +${5*a.mastered.length}%</span> <span class="pill">Synergy: +${5*completedGroups()}%</span></p>`;
  html+=`<button class="choice" data-act="buyMarg" data-v="mm" ${a.legacy>=1?"":"disabled"}>🔩 Marginal Gains <span class="tiny">(rank ${a.marginal||0} · +${(marginalBonus()*100).toFixed(0)}% total) — 1 Legacy, repeatable forever</span></button>`;
  for(const g in groups){
    const done=groups[g].every(n=>a.mmNodes.includes(n.id));
    html+=`<p style="margin:10px 0 2px"><b>${g}</b>${done?" <span class='q-done'>✓ group complete (+5%)</span>":""}</p>`;
    html+=groups[g].map(n=>{
      const owned=a.mmNodes.includes(n.id);
      return owned
        ? `<div class="choice" style="opacity:.65">✅ <b>${n.name}</b> — ${n.desc}</div>`
        : `<button class="choice" data-act="buyNodeMM" data-v="${n.id}" ${canBuy?"":"disabled"}><b>${n.name}</b> — ${n.desc} <span class="tiny">(1 Legacy)</span></button>`;
    }).join("");
  }
  if(bankedElsewhere) html+=`<p class="tiny" style="margin-top:10px">🧠 <b>${bankedElsewhere}</b> more perk${bankedElsewhere>1?"s":""} banked from past lives (other classes) — still active, buyable again only while living that class.</p>`;
  html+=`<button class="choice" data-act="closeModal" style="margin-top:10px">Close</button>`;
  showModal(html);
}
function doRegress(lifestyle){
  const a=S.account, prevDisc=S.run.disc;
  // award legacy + record mastery
  awardRunLegacy();   // flag-guarded — already banked when the screen opened; safe no-op here
  if(!a.mastered.includes(prevDisc)) a.mastered.push(prevDisc);
  a.disciplineFloors[prevDisc]={str:S.run.str,end:S.run.end,mob:S.run.mob};
  a.ascensions++;
  if(S.run.bossBeaten) recordBoard();   // ranked: log this completed run's ascension speed
  closeModal();
  S.run=freshRun(_nextDisc, lifestyle);
  S.run.path=_nextPath;   // apply chosen challenge path to the new life
  S.run.mode=_nextMode||"normal";   // apply chosen access mode (Phase D)
  const pp=_nextPath?CHALLENGE_PATHS.find(x=>x.id===_nextPath):null; _nextPath=null;
  logLine("gold",`✨ ASCENDED. Reincarnated as a ${_nextDisc} ${lifestyle==="slob"?"slob (respect)":"adult with a membership"}${pp?` on the <b>${pp.em} ${pp.name}</b> path`:""}. Muscle memory kept: STR ${a.floors.str}/END ${a.floors.end}/MOB ${a.floors.mob}. Legacy ${a.legacy}.`);
  if(pp) logLine("sys",`${pp.em} <b>${pp.name}</b>: ${pp.note}`);
  coachSay("dailyReturn");
  save(); render();
}

/* --- goal-gradient engine (Chunk 3): a named gate + countable KEY-SET drives tier-up (GAP-B fix) --- */
function curGate(){ return gateFor(S.run.disc, S.run.tier); }
function keyProg(){ if(!S.run.keys) S.run.keys={}; return S.run.keys[S.run.tier]||(S.run.keys[S.run.tier]={}); }
function keyProgRO(){ return (S.run.keys&&S.run.keys[S.run.tier])||{}; }
function sigMatch(k,sig){ return Array.isArray(k.sig)? k.sig.includes(sig) : k.sig===sig; }
function gateDone(){ const g=curGate(); if(!g) return false; const kp=keyProgRO(); return g.keys.every(k=>(kp[k.id]||0)>=k.need); }
function tickKeys(sig, data){
  data=data||{}; const g=curGate(); if(!g) return;
  const kp=keyProg(); let changed=false;
  for(const k of g.keys){
    if(!sigMatch(k,sig)) continue;
    if(k.loc && data.loc!==k.loc) continue;
    if(k.trainId && sig==="train" && data.id!==k.trainId) continue;   // exercise-specific keys (e.g. legs)
    if((kp[k.id]||0) < k.need){ kp[k.id]=(kp[k.id]||0)+1; changed=true; }
  }
  if(changed) maybeCertify();
}
function maybeCertify(){
  const r=S.run;
  if(r.tier>=maxTier() || !gateDone()) return;
  if(r.tier<2){ certify(); return; }                 // couch tutorial: auto-pass (no world/arena yet)
  if(!r.tierBossReady){ r.tierBossReady=true; coachSay("gateReady");
    logLine("gold",`📣 ${speakerName()}: work's done — now PROVE it. The Arena's open for the Tier ${r.tier+1} Trial (a ${DISCIPLINES[r.disc].key.toUpperCase()} check).`); }
}
function certify(){
  const r=S.run;
  r.tier++; r.gains=0; r.tierBossReady=false;
  if(r.keys) r.keys[r.tier-1]=null;                            // clear the finished gate's progress
  S.account.floors.str=Math.max(S.account.floors.str,r.str);   // bank peaks for the muscle-memory floor
  S.account.floors.end=Math.max(S.account.floors.end,r.end);
  S.account.floors.mob=Math.max(S.account.floors.mob,r.mob);
  const acc=(r.tier<=floorTierCap()&&S.account.mastered.length)?" <span class='tiny'>(muscle memory — accelerated)</span>":"";
  logLine("gold",`✅ CERTIFIED by ${speakerName()} → Tier ${r.tier}: <b>${tierName(r.disc,r.tier)}</b>${acc}`);
  if(r.tier>=maxTier()){ r.arenaOpen=true; logLine("gold", r.disc==="Newbie"?"🎓 You've sampled it all. The Fitness Assessment awaits in the Arena — pass it and CHOOSE your path.":"🏆 THE GOAT. Nothing left to climb — the Olympia stage awaits (Arena)."); coachSay("bossIntro"); }
  else { coachSay("gateCertify"); const ng=curGate(); if(ng) logLine("sys",`📋 New objective — <b>${ng.title}</b>: ${ng.give}`); }
}

/* --- after any action: recompute, persist, render --- */
function afterAction(card){
  if(card===undefined) card=true;
  S.run.actions=(S.run.actions||0)+1;   // ranked ascension-speed: fewer actions to the top = better
  const _ev=activeEvent(); if(_ev&&_ev.dn) addMeter(_ev.dn.meter,_ev.dn.amt);   // event's per-action downside (or ambient relief)
  S.run.buffs=S.run.buffs.filter(b=>{ if(b.turns!=null){ b.turns--; if(b.turns<=0){ logLine("sys",`⌛ ${b.em||"✨"} ${b.name||b.id} wore off.`); return false; } return true; } return true; });
  maybeCertify(); save();
  if(S.run.lifestyle==="slob" && S.run.tier===0 && S.run.disc!=="Newbie"){  // slob-death clock (training certifies you out of tier 0 first)
    S.run.slobClock=(S.run.slobClock||0)+1; S.run.health=clamp(S.run.health-2,0,30); maybeSlobDeath();
  }
  if(card!==false && S.log[0]){                 // show the outcome as a sketch + text card
    const e=S.log[0];
    const pose=(card&&typeof card==="object"&&card.pose)?card.pose:(e.c==="win"?"flex":e.c==="lose"?"slob":"idle");
    const props=(card&&typeof card==="object"&&card.props)||[];
    S.run.enc=null;
    S.run.outcome={sketch:{pose,props},text:e.h,cls:e.c};
  }
  render();
}

/* --- can watch ad? (hardcore greys the button) --- */
/* --- AD ECONOMY (anti-abuse + honest-mockery): every ad is a straight +20% screen time, and the stamina
   it hands back shrinks each day (5,4,3,2,1 → 0). Screen maxed = no more ads or doomscroll — the hard cap
   that stops permanent ad-fuelled stamina. Watching an ad is ALLOWED and stays Natty — the Coach just can't
   help ribbing you for pausing the grind to stare at your phone. Lines may use {c}=a coach, {n}=your name. --- */
const AD_SNARK=[
  (g)=>`{c} looks up: "Watching an ad? Mid-session? C'mon {n} — FOCUS. Focus!" ...You got ${g} stamina out of it, at least.`,
  (g)=>`"Phone down, {n}." {c} sighs. "You paused your one life to watch a mattress commercial for ${g} stamina." A long, disappointed blink.`,
  (g)=>`That was a long one. You gave the developer a full, uninterrupted viewing in exchange for ${g} stamina. Generous. Saintly, even.`,
  (g)=>`{c} caught you: "Is that... an AD? During YOUR workout? ${g} stamina, {n}. That's what you sold your focus for." Rough.`,
  (g)=>`You could've rested for free. Instead you watched a stranger yell about car insurance for ${g} stamina. Bold choice, {n}.`,
  (g)=>`+${g} stamina. The ad was longer than the workout it funded. {c} would like that noted for the record.`,
  (g)=>`"Back to it, {n}." {c} claps once. "Thirty seconds of your life for ${g} stamina. We don't talk about the exchange rate."`,
  (g)=>`${g} whole stamina. Was the trade-off worth it? Be honest. The skip button was right there the whole time.`,
  (g)=>`Somewhere a metric ticked up and a yacht got shinier. You got ${g} stamina. Everyone won. Mostly them.`,
  (g)=>`"${g} stamina," {c} repeats, slowly. "And the ads only get longer from here, {n}. You know that. ...Right?"`,
];
function adSnark(g){
  const n=esc((S.account&&S.account.name)||"champ");
  return pick(AD_SNARK)(g).replace(/\{c\}/g, speakerName()).replace(/\{n\}/g, n);
}
function adStaminaGain(){ return Math.max(0, 5 - (S.run.adsToday||0)); }   // diminishing: 1st=5, 2nd=4 … 5th=1, then nothing
function adBlockReason(){
  if(S.run.mode==="hardcore") return "🚫 Ads off (Hardcore)";
  if(pathHas("nattyOnly")) return "🚫 Ads off (Raw Dogging It)";
  if(pathHas("noConsumables")) return "🚫 Ads off (Air & Discipline)";
  if(S.run.meters.screen>=100) return "🧠 Screen maxed — touch grass";
  if(adStaminaGain()<=0) return "📺 No ad stamina left today";
  return null;
}
function canWatchAd(){ return !adBlockReason(); }

function renderQuest(){

      ? `<div class="q-done"><b>${fin?"🎓 Assessment passed — ready to CHOOSE your path.":"🏆 THE GOAT — all clear."}</b> Hit the Arena and Regress.</div>`

/* hand-drawn map buildings (ported from v0.2.1 — crude pencil line art) */
function building(id,x,y,p){
  const s=`stroke="${p}" fill="none" stroke-width="1.8" stroke-linecap="round"`;
  switch(id){
    case "home": return `<path d="M${x-11} ${y+9} L${x-11} ${y-3} L${x} ${y-12} L${x+11} ${y-3} L${x+11} ${y+9} Z" ${s}/><rect x="${x-3}" y="${y+1}" width="6" height="8" ${s}/>`;
    case "gym":  return `<line x1="${x-11}" y1="${y}" x2="${x+11}" y2="${y}" stroke="${p}" fill="none" stroke-width="2.4" stroke-linecap="round"/><rect x="${x-14}" y="${y-5}" width="4" height="10" ${s}/><rect x="${x+10}" y="${y-5}" width="4" height="10" ${s}/>`;
    case "park": return `<line x1="${x-7}" y1="${y+9}" x2="${x-7}" y2="${y-2}" ${s}/><circle cx="${x-7}" cy="${y-6}" r="6" ${s}/><line x1="${x+7}" y1="${y+9}" x2="${x+7}" y2="${y}" ${s}/><circle cx="${x+7}" cy="${y-4}" r="5" ${s}/>`;
    case "work": return `<rect x="${x-13}" y="${y-6}" width="7" height="16" ${s}/><rect x="${x-4}" y="${y-12}" width="8" height="22" ${s}/><rect x="${x+6}" y="${y-3}" width="7" height="13" ${s}/>`;
    case "store":return `<rect x="${x-11}" y="${y-2}" width="22" height="11" ${s}/><path d="M${x-13} ${y-2} L${x-9} ${y-8} L${x+13} ${y-8} L${x+9} ${y-2}" ${s}/><text x="${x}" y="${y+7}" font-size="9" text-anchor="middle" fill="${p}" font-family="'Patrick Hand',cursive">$</text>`;
    case "clinic":return `<rect x="${x-12}" y="${y-9}" width="24" height="18" ${s}/><line x1="${x}" y1="${y-5}" x2="${x}" y2="${y+5}" stroke="${p}" fill="none" stroke-width="2.6" stroke-linecap="round"/><line x1="${x-5}" y1="${y}" x2="${x+5}" y2="${y}" stroke="${p}" fill="none" stroke-width="2.6" stroke-linecap="round"/>`;
    case "feed":  return `<rect x="${x-7}" y="${y-11}" width="14" height="22" rx="2" ${s}/><path d="M${x-3.5} ${y-3} q-2 -3 1 -4 q2 -0.5 2.5 1.5 q0.5 -2 2.5 -1.5 q3 1 1 4 l-3.5 4 Z" ${s}/>`;
    case "kitchen":return `<path d="M${x-10} ${y-1} h20 l-2 11 h-16 z" ${s}/><line x1="${x-13}" y1="${y-1}" x2="${x+13}" y2="${y-1}" stroke="${p}" fill="none" stroke-width="2.2" stroke-linecap="round"/><path d="M${x-4} ${y-8} q-1 -3 2 -4 M${x+3} ${y-8} q-1 -3 2 -4" ${s}/>`;
    case "arena":return `<ellipse cx="${x}" cy="${y+2}" rx="13" ry="9" ${s}/><line x1="${x-9}" y1="${y-4}" x2="${x-9}" y2="${y-13}" ${s}/><path d="M${x-9} ${y-13} l6 2 l-6 2" ${s}/><line x1="${x+9}" y1="${y-4}" x2="${x+9}" y2="${y-13}" ${s}/><path d="M${x+9} ${y-13} l-6 2 l6 2" ${s}/>`;
    // class-only locations (batch 2b)
    case "posing":  return `<rect x="${x-8}" y="${y-11}" width="16" height="22" rx="1" ${s}/><line x1="${x-4}" y1="${y-7}" x2="${x+3}" y2="${y+5}" ${s}/><line x1="${x+1}" y1="${y-8}" x2="${x+5}" y2="${y-2}" ${s}/>`;
    case "velodrome":return `<circle cx="${x}" cy="${y}" r="10" ${s}/><circle cx="${x}" cy="${y}" r="2" ${s}/><line x1="${x}" y1="${y-10}" x2="${x}" y2="${y+10}" ${s}/><line x1="${x-10}" y1="${y}" x2="${x+10}" y2="${y}" ${s}/><line x1="${x-7}" y1="${y-7}" x2="${x+7}" y2="${y+7}" ${s}/><line x1="${x-7}" y1="${y+7}" x2="${x+7}" y2="${y-7}" ${s}/>`;
    case "rings":   return `<line x1="${x-6}" y1="${y-12}" x2="${x-6}" y2="${y-2}" ${s}/><circle cx="${x-6}" cy="${y+3}" r="5" ${s}/><line x1="${x+6}" y1="${y-12}" x2="${x+6}" y2="${y-2}" ${s}/><circle cx="${x+6}" cy="${y+3}" r="5" ${s}/>`;
    case "private": return `<rect x="${x-12}" y="${y-2}" width="24" height="8" rx="1" ${s}/><rect x="${x-9}" y="${y-6}" width="8" height="5" ${s}/><line x1="${x-10}" y1="${y+6}" x2="${x-10}" y2="${y+10}" ${s}/><line x1="${x+10}" y1="${y+6}" x2="${x+10}" y2="${y+10}" ${s}/>`;
    case "throwdown":return `<rect x="${x-12}" y="${y}" width="8" height="10" ${s}/><rect x="${x-4}" y="${y-8}" width="8" height="18" ${s}/><rect x="${x+4}" y="${y-4}" width="8" height="14" ${s}/>`;
    case "benchmark":return `<rect x="${x-12}" y="${y-9}" width="24" height="18" rx="1" ${s}/><line x1="${x-8}" y1="${y-4}" x2="${x+8}" y2="${y-4}" ${s}/><line x1="${x-8}" y1="${y}" x2="${x+5}" y2="${y}" ${s}/><line x1="${x-8}" y1="${y+4}" x2="${x+7}" y2="${y+4}" ${s}/>`;
    case "event":  return `<path d="M${x-14} ${y+9} L${x-13} ${y-2} Q${x} ${y-15} ${x+13} ${y-2} L${x+14} ${y+9} Z" ${s}/><path d="M${x-6} ${y+9} L${x-5} ${y+1} Q${x} ${y-3} ${x+5} ${y+1} L${x+6} ${y+9}" ${s}/><line x1="${x}" y1="${y-13}" x2="${x}" y2="${y-20}" ${s}/><path d="M${x} ${y-20} l7 2 l-7 2.5" ${s}/>`;
    case "warehouse":return `<rect x="${x-15}" y="${y-3}" width="30" height="13" ${s}/><path d="M${x-15} ${y-3} L${x-15} ${y-9} L${x+15} ${y-9} L${x+15} ${y-3}" ${s}/><rect x="${x-10}" y="${y}" width="8" height="8" ${s}/><rect x="${x+1}" y="${y}" width="8" height="8" ${s}/><circle cx="${x+11}" cy="${y-12}" r="5" ${s}/><line x1="${x+9}" y1="${y-10}" x2="${x+13}" y2="${y-14}" ${s}/>`;
  }
  return "";
}
/* per-tier physique avatar (slob→GOAT), ported from v0.2.1 — morphs with tier */
function avatarSVG(){
  const t=S.run.tier;
  const col=cssvar('--ink')||'#2a2622', acc=cssvar('--accent')||'#355070', paper=cssvar('--paper')||'#f4efe4';
  const gut=clamp(1 - t/4,0,1);      // fatness: full at T0, gone by T4
  const mus=clamp((t-2)/5,0,1);      // muscle: starts T2, maxed T7
  const cx=32, shY=25, blY=39, hpY=50, ftY=74;
  const shH=(7+mus*15)/2, blH=(9+gut*22-mus*4)/2, hpH=(8+gut*10-mus*2)/2;
  const bx=blH+3+gut*5, by=blY+gut*4;
  const armW=(1.8+mus*2.6).toFixed(1), legW=(2+mus*2.2).toFixed(1), lw=1.9;
  const s=`stroke="${col}" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
  const flex=t>=5; let g="";
  const headR=(6.5+gut*2).toFixed(1);
  g+=`<circle cx="${cx}" cy="12" r="${headR}" ${s} stroke-width="${lw}" fill="${t>=7?acc:'none'}"/>`;
  if(t<=1){
    g+=`<path d="M ${cx-6} 8 l2 -3 M ${cx-2} 7 l1 -3 M ${cx+2} 7 l2 -3" ${s} stroke-width="1.2"/>`;
    g+=`<path d="M ${cx-5.5} 18.5 Q ${cx} 23.5 ${cx+5.5} 18.5" ${s} stroke-width="1.3"/>`;
    g+=`<circle cx="${cx-2.5}" cy="12" r=".7" fill="${col}" stroke="none"/><circle cx="${cx+2.5}" cy="12" r=".7" fill="${col}" stroke="none"/>`;
    g+=`<path d="M ${cx-2} 15.2 Q ${cx} 14.2 ${cx+2} 15.4" ${s} stroke-width="1.1"/>`;
  } else {
    const fc=t>=7?paper:col;
    g+=`<circle cx="${cx-2.5}" cy="12" r=".7" fill="${fc}" stroke="none"/><circle cx="${cx+2.5}" cy="12" r=".7" fill="${fc}" stroke="none"/>`;
    g+=`<path d="M ${cx-2.5} 14.5 Q ${cx} 16 ${cx+2.5} 14.5" stroke="${fc}" fill="none" stroke-linecap="round" stroke-width="1.1"/>`;
  }
  if(t>=7) g+=`<path d="M ${cx-9} 4 l1.5 3 M ${cx} 2.5 l0 3 M ${cx+9} 4 l-1.5 3" stroke="${acc}" stroke-width="1.3" stroke-linecap="round"/>`;
  g+=`<line x1="${cx}" y1="18.5" x2="${cx}" y2="${shY-1}" ${s} stroke-width="${lw}"/>`;
  g+=`<path d="M ${cx-shH} ${shY} Q ${cx-bx} ${by} ${cx-hpH} ${hpY} L ${cx+hpH} ${hpY} Q ${cx+bx} ${by} ${cx+shH} ${shY} Z" ${s} stroke-width="${lw}"/>`;
  if(mus>0.05) g+=`<path d="M ${cx-shH+1.5} ${shY+5} Q ${cx} ${shY+8} ${cx+shH-1.5} ${shY+5}" ${s} stroke-width="1.3"/>`;
  if(gut>0.3) g+=`<path d="M ${cx-blH+2} ${blY+3} Q ${cx} ${blY+5} ${cx+blH-2} ${blY+3}" ${s} stroke-width="1.1"/>`;
  if(mus>0.55){
    for(let i=0;i<3;i++){ const ay=blY-2+i*4; g+=`<line x1="${cx}" y1="${ay}" x2="${cx}" y2="${ay+2}" ${s} stroke-width="1"/>`; }
    g+=`<line x1="${cx-3}" y1="${blY}" x2="${cx-3}" y2="${blY+6}" ${s} stroke-width="1"/><line x1="${cx+3}" y1="${blY}" x2="${cx+3}" y2="${blY+6}" ${s} stroke-width="1"/>`;
  }
  if(flex){
    g+=`<path d="M ${cx-shH} ${shY+1} Q ${cx-shH-7} ${shY-3} ${cx-shH-4} ${shY-9} Q ${cx-shH-1} ${shY-13} ${cx-shH+3} ${shY-10}" ${s} stroke-width="${armW}"/>`;
    g+=`<path d="M ${cx+shH} ${shY+1} Q ${cx+shH+7} ${shY-3} ${cx+shH+4} ${shY-9} Q ${cx+shH+1} ${shY-13} ${cx+shH-3} ${shY-10}" ${s} stroke-width="${armW}"/>`;
  } else {
    g+=`<path d="M ${cx-shH} ${shY+1} Q ${cx-blH-5} ${blY} ${cx-hpH-3} ${hpY+4}" ${s} stroke-width="${armW}"/>`;
    g+=`<path d="M ${cx+shH} ${shY+1} Q ${cx+blH+5} ${blY} ${cx+hpH+3} ${hpY+4}" ${s} stroke-width="${armW}"/>`;
    if(t<=1) g+=`<rect x="${cx+hpH+1}" y="${hpY+3}" width="4" height="6" rx="1" ${s} stroke-width="1.1"/>`;
  }
  g+=`<line x1="${cx-hpH+1}" y1="${hpY}" x2="${cx-hpH-1}" y2="${ftY}" ${s} stroke-width="${legW}"/>`;
  g+=`<line x1="${cx+hpH-1}" y1="${hpY}" x2="${cx+hpH+1}" y2="${ftY}" ${s} stroke-width="${legW}"/>`;
  g+=`<line x1="${cx-hpH-1}" y1="${ftY}" x2="${cx-hpH-5}" y2="${ftY}" ${s} stroke-width="${legW}"/>`;
  g+=`<line x1="${cx+hpH+1}" y1="${ftY}" x2="${cx+hpH+5}" y2="${ftY}" ${s} stroke-width="${legW}"/>`;
  const filter=`<defs><filter id="pncl" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/></filter></defs>`;
  return `<svg viewBox="0 0 64 84" width="60" height="78" aria-label="your physique">${filter}<g filter="url(#pncl)">${g}</g></svg>`;
}
function renderMain(){
  const r=S.run;
  if(r.outcome){ const o=r.outcome; $("#main").innerHTML=`${SKETCH.make(o.sketch)}<div class="flav le ${o.cls}" style="font-size:15px">${o.text}</div><button class="choice" data-act="clearOutcome" style="margin-top:8px">↩︎ Continue</button>`; return; }
  if(!worldOpen()){ S.run.enc=buildEncounter("home"); S.run.enc.noBack=true; return renderEncounter(); } // first run: couch only until Tier 2
  if(r.enc){ return renderEncounter(); }
  const nodes=[
    {id:"home",   x:58,  y:56,  on:true,                   label:"home"},
    {id:"park",   x:180, y:44,  on:true,                   label:venueLabel(r.disc,"park","the park")},
    {id:"gym",    x:302, y:56,  on:true,                   label:venueLabel(r.disc,"gym","the gym")},
    {id:"kitchen",x:50,  y:150, on:true,                   label:"the kitchen"},
    {id:"work",   x:180, y:160, on:true,                   label:"downtown"},
    {id:"feed",   x:310, y:150, on:true,                   label:"the feed"},
    {id:"store",  x:58,  y:256, on:true,                   label:"supp. store"},
    {id:"clinic", x:180, y:276, on:true,                   label:"the clinic"},
    {id:"arena",  x:302, y:256, on:(r.tier>=maxTier()?r.arenaOpen:r.tierBossReady), label:"THE ARENA"},
  ];
  nodes.push({id:"warehouse", x:58, y:335, on:true, label:"warehouse sale"});   // grind-for-rares zone (always open once world does)
  const cl=classLocation();                                   // class-only "inner sanctum" node (batch 2b)
  if(cl) nodes.push({id:cl.id, x:180, y:335, on:true, label:cl.label});
  const _ev=activeEvent();                                    // event tent — appears only while an event is live (a place to fight/re-attempt)
  if(_ev) nodes.push({id:"event", x:300, y:335, on:true, label:"🎪 "+_ev.name.split(/[ /]/)[0]});
  const MAP_H = 380;                                          // 4th row (warehouse + class + event) always present once world opens
  const pen=cssvar('--ink')||'#2a2622', acc=cssvar('--accent')||'#355070', paper=cssvar('--paper')||'#f4efe4';
  const hub=nodes.find(n=>n.id==="work");
  let roads=""; for(const n of nodes){ if(n.id==="work")continue; roads+=`<line x1="${hub.x}" y1="${hub.y}" x2="${n.x}" y2="${n.y}" stroke="${pen}" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round" opacity=".5"/>`; }
  let art=roads;
  for(const n of nodes){
    const sq = n.on ? sideQuestsAt(n.id).length : 0;
    art+=`<g opacity="${n.on?1:.4}">${building(n.id,n.x,n.y,pen)}</g>`;
    if(sq) art+=`<text x="${n.x+15}" y="${n.y-8}" font-size="12" text-anchor="middle">📋</text>`;
    art+=`<text x="${n.x}" y="${n.y+24}" font-size="12.5" text-anchor="middle" font-family="'Patrick Hand',cursive" fill="${pen}">${n.on?n.label:"? ? ?"}</text>`;
  }
  const filter=`<filter id="pencilmap" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/></filter>`;
  const hits=nodes.map(n=>n.on
    ? `<circle class="hit" data-act="place" data-v="${n.id}" cx="${n.x}" cy="${n.y}" r="23" fill="transparent" style="cursor:pointer"/>`
    : `<circle cx="${n.x}" cy="${n.y}" r="23" fill="transparent"/>`).join("");
  $("#main").innerHTML=`<svg viewBox="0 0 360 ${MAP_H}" width="100%" style="max-width:430px;display:block;margin:0 auto" role="img" aria-label="Town map">
      <defs>${filter}</defs><rect x="0" y="0" width="360" height="${MAP_H}" fill="${paper}"/>
      <g filter="url(#pencilmap)">${art}</g>${hits}</svg>
    <p class="tiny" style="text-align:center;margin-top:4px">Tap a place. 📋 = someone needs you (side quest). Every action spends stamina. (Dev refill below.)</p>`;
}
function renderEncounter(){
  const e=S.run.enc;
  $("#main").innerHTML=`${SKETCH.make(e.sketch)}
    <h3>${e.title}</h3><p class="flav">${e.flav}</p>
    ${e.choices.map((c,i)=>`<button class="choice" data-act="choose" data-v="${i}">${c.label}${c.cost?` <span class="tiny">(${c.cost}⚡)</span>`:""}</button>`).join("")}
    ${(e.sidequests&&e.sidequests.length)?`<div style="margin-top:12px;border-top:1px dashed var(--ink);padding-top:8px"><p class="tiny" style="margin:0 0 5px"><b>📋 Something's going on here:</b></p>${e.sidequests.map(sq=>`<button class="choice" data-act="startSQ" data-v="${sq.id}" style="border-style:dashed">📋 ${sq.title}${sq.repeatable?` <span class="tiny">(repeatable)</span>`:""}</button>`).join("")}</div>`:""}
    ${e.noBack?`<p class="tiny" style="margin-top:8px">🔒 <b>COACH:</b> there's a whole world out there — the park, the gym, worse ideas. Reach <b>Tier 2</b> and I'll unlock the door.</p>`:`<button class="choice" data-act="leaveEnc">↩︎ Back to the map (free)</button>`}`;
}
function renderLog(){
  $("#log").innerHTML = S.log.length? S.log.map(e=>`<div class="le ${e.c}">${e.h}</div>`).join("")
    : `<div class="le muted">Nothing yet. Go touch some grass. Or iron.</div>`;
}

/* --- location → encounter builders (choice-adventure 4-branch template) --- */
function openPlace(id){
  const r=S.run;
  if(id==="arena"){
    if(r.tier>=maxTier()){
      if(!r.bossBeaten){ openBoss(); return; }
      if(canAscend()){ regressScreen(); return; }
    } else if(r.tierBossReady){ openTierBoss(); return; }
    logLine("sys","The Arena is quiet. Finish your objectives first."); render(); return;
  }
  if(id==="gym" && pathHas("noGym")){ logLine("lose","🪵 The Minimalist: no iron, no machines, no membership. The gym stays locked. Bodyweight and the outdoors only."); render(); return; }
  if(id==="event"){ const ev=activeEvent(); if(ev){ r.enc=buildEventEncounter(ev.id); render(); return; } logLine("sys","📅 The event tent is being packed up — nothing on today."); render(); return; }
  r.enc = buildEncounter(id);
  if((classProfile().offVenues||[]).includes(id) && classProfile().warn) logLine("sys",`🗣️ ${speakerName()}: ${classProfile().warn}`);  // pre-entry telegraph
  render();
}
function buildEncounter(id){ // wrapper: attach location-bound side-quests + class-identity filter
  const e=_buildEncBase(id);
  if(e && !e.isSQ){ e.loc=id; e.sidequests=sideQuestsAt(id);
    if(e.choices) e.choices=e.choices.filter(c=>!(c.offTheme && c.stat && isOffPath(c.stat)));  // (A) hide off-theme + off-path options (BB gym → iron & mirror)
    if(e.choices && S.run.meters.screen>=100) e.choices=e.choices.filter(c=>!/^📱/.test(c.label));  // screen maxed → can't doomscroll either; the 📵 "log off" escapes stay
  }
  return e;
}

function buyItem(id){
  const it=ITEMS[id];
  if(pathHas("noConsumables")){ logLine("lose","🫁 Air & Discipline: no consumables. Put it back. You run on spite."); afterAction(); return; }
  if(pathHas("nattyOnly") && it.tag!=="natty"){ logLine("lose","🌿 Raw Dogging It: strictly natty. That shelf is off-limits this run."); afterAction(); return; }
  if(S.run.cash<it.cost){ logLine("lose","💵 Can't afford it."); afterAction(); return; }
  S.run.cash-=it.cost;
  const msg=it.use(S); // use() mutates S.run
  logLine("win",`${it.em} <b>${it.name}</b> — ${it.flav} <i>${msg}</i>`);
  tickKeys("buy",{id});
  afterAction();
}

/* ============================ SIDE-QUESTS (v0.3.3) ============================ */
/* Location-bound: surfaced when you visit a place whose tier-window + gate you meet.
   repeatable quests stay but their cash reward decays each time (sqDecay). */
function sqDecay(id){ const n=S.run.sqCount[id]||0; return Math.max(0.3, Math.pow(0.6,n)); }
function sideQuestsAt(loc){
  if(!worldOpen()) return [];
  const r=S.run;
  return SIDEQUESTS.filter(q=>q.loc===loc)
    .filter(q=>r.tier>=(q.tierMin||0) && r.tier<=(q.tierMax!=null?q.tierMax:7))
    .filter(q=>q.repeatable || !r.sqCount[q.id])          // non-repeatable disappears after one completion
    .filter(q=>!q.gate || q.gate(S));
}
function buildSQEncounter(id){
  const q=SIDEQUESTS.find(s=>s.id===id);
  if(!q) return buildEncounter("home");
  const choices=q.branches.map((b,i)=>({label:b.label,cost:b.cost,do:()=>resolveSQBranch(id,i)}));
  choices.push({label:"↩︎ Not now (leave it)",do:()=>{ S.run.enc=buildEncounter(q.loc); render(); }});
  return {title:"📋 "+q.title, flav:q.brief, sketch:q.sketch||{pose:"idle"}, isSQ:true, loc:q.loc, choices};
}
function resolveSQBranch(id,i){
  const q=SIDEQUESTS.find(s=>s.id===id); if(!q) return render();
  const b=q.branches[i];
  const decay = q.repeatable ? sqDecay(id) : 1;
  const out = b.resolve(S,decay) || {};
  if(!b.out) S.run.sqCount[id]=(S.run.sqCount[id]||0)+1;   // opt-out branches don't "consume" the quest
  logLine(out.cls||"sys", out.text||"");
  afterAction({pose: out.pose || (out.cls==="win"?"flex":out.cls==="lose"?"slob":"idle"), props: out.props||[]});
}

/* New Year's Resolution Collapse — the flagship daily advent (escalating box; miss a day = the collapse) */
function claimAdvent(){
  const a=S.account, d=a.dayCount||0;
  if(a.adventClaimedDay===d){ logLine("sys","🎁 Already claimed today's box. Come back on a real new day — the Resolutioner is watching the calendar, not your clock."); afterAction(false); return; }
  let collapsed=false;
  if(a.adventClaimedDay===d-1) a.adventStreak=(a.adventStreak||0)+1;
  else { if((a.adventStreak||0)>1) collapsed=true; a.adventStreak=1; }
  a.adventClaimedDay=d;
  const s=a.adventStreak, cash=10*s, pct=Math.min(0.40,0.05*s);
  S.run.cash+=cash;
  S.run.buffs.push({id:"resolute",name:"Resolute",em:"🎯",turns:4+s,gainMult:pct});
  const drops=lootRoll();
  logLine("win",(collapsed?"💥 You missed a day — like 92% of resolutioners. Streak COLLAPSED to 1. The Resolutioner nods knowingly. ":"")+`🎁 Resolution Box — day ${s}: +$${cash}, <b>Resolute</b> +${Math.round(pct*100)}% gains${drops.length?`, plus ${drops.map(x=>x.em+" "+x.name).join(", ")}`:""}. ${s>=7?"Seven days?! You've out-resolutioned the entire gym.":"Streak keeps the perk climbing — if you can keep showing up."}`);
  coachSay("trainedWell"); afterAction(false);
}

/* event mini-boss fight — 3-beat stat check; win drops the event-exclusive item + cash + gains + trophy */
function openEventBoss(id){
  const b=EVENT_BOSS[id], r=S.run; if(!b) return;
  if(r.injured){ logLine("lose","🤕 Injured — can't take on "+b.name+". Rest first."); render(); return; }
  if(r.stam<4){ logLine("lose","😮‍💨 Too drained to face "+b.name+" (needs 4⚡)."); render(); return; }
  r.stam-=4;
  const buffPts=r.buffs.reduce((a,x)=>a+(x.gainMult?Math.round(x.gainMult*10):0),0);
  const your=(usesBestStat(r.disc)?Math.max(r.str,r.end,r.mob):(r[b.stat]||1))+buffPts+nodeSum("trialBonus")+gearSum("might");
  const target=5+r.tier*2;
  let beats=0,lines=[];
  for(let i=0;i<3;i++){ const roll=your*(0.7+Math.random()*0.7), okb=roll>=target; if(okb)beats++; lines.push(`Beat ${i+1}: ${okb?"win":"shaky"} (${Math.round(roll)} vs ${target})`); }
  const won=beats>=2; let rew="";
  if(won){
    // DROP BY RARITY — re-attemptable, so you grind the event chasing the rare signature + the legendary
    const roll=Math.random(); let dropId;
    if(roll<0.04) dropId=pick(eventDropIds(3))||b.loot;       // ~4% LEGENDARY (crown jewel, any event)
    else if(roll<0.36) dropId=b.loot;                          // ~32% the event's signature RARE
    else dropId=pick(eventDropIds(1))||b.loot;                 // ~64% COMMON event drop
    const it=LOOT.find(x=>x.id===dropId); grantItem(it);   // routes gear → kit, collectibles → stash
    const cash=12+r.tier*2; r.cash+=cash; addGains(5); awardTrophy(id);
    const rr=it?RARITY[it.rarity||0]:null;
    rew=`VICTORY — dropped ${it?`${it.em} <b style="color:${rr.col}">${it.name}</b> <span class="tiny">(${rr.name}${it.rarity>=3?"!!":""})</span>`:"loot"}, +$${cash}, and some gains. Re-fight it to chase rarer drops.`; }

function recordBoard(){ const r=S.run, a=S.account; if(!a.boards) a.boards=[];

function openBoards(){
  const all=BOARD_NPCS.concat(S.account.boards||[]);
  const col=(div)=>{ const rows=all.filter(e=>e.div===div).sort((x,y)=>x.actions-y.actions).slice(0,10);
    return rows.length ? rows.map((e,i)=>`<div class="choice" style="display:flex;justify-content:space-between;align-items:center${e.who==="You"?";border-color:var(--accent)":""}"><span>${i+1}. ${e.who==="You"?"<b>You</b>":e.who} <span class="tiny">(${e.disc}${e.path?" · path":""})</span></span><span><b>${e.actions}</b> <span class="tiny">actions</span></span></div>`).join("")
      : `<p class="muted tiny">No entries yet — beat a run to post a time.</p>`; };

  return rp(["Couch","Snacc","DOMS","Chip","Lazy","Benchy","Gary","Reese","Grippy","Sir Naps","Dusty","Reclina"])
   +" "+rp(["Prince","McGee","Dipson","the Untrained","O'Lounge","Supreme","McBenchface","Potato","von Rest","the Reluctant","Crumbs","Sock"]); }

function openOnboarding(){
  const suggested = randomSlobName();
  showModal(`
    <img class="ob-logo" src="icon-192.png" width="104" height="104" alt="R2P" onerror="this.style.display='none'"/>
    <h3 style="text-align:center;margin:2px 0 6px">Regress to Progress</h3>
    <p class="flav" style="text-align:center;margin-top:0">A comedy fitness idle-RPG.<br><i>When does fitness ever end?</i></p>
    <div class="fb-brief">
      You are a slob on a couch. A passive-aggressive AI coach has analysed your selfies, your step count,
      and that 3:23 AM UberEats from Papa John's. There is <b>so much work</b> to do.<br>First — what do we call you?
    </div>
    <label class="tiny">Your name</label>
    <input class="txt" id="obname" maxlength="24" value="${esc(suggested)}" autocomplete="off" spellcheck="false"/>
    <div style="margin:0 0 10px"><button data-act="randName">🎲 Surprise me</button></div>
    <button class="choice" data-act="beginOnboard"><b>Begin the grind →</b></button>
  `);
}
